# Execution profile (docs/architecture.md section 5, "Configurability: four profiles", the
# Execution column). See profiles/design.yaml's header comment for the shared rules
# (profiles select components, never numerical behaviour -- ADR-000 rule 1) and
# profiles/README.md for the schema and the "status: not_yet_built" convention.
#
# The Python gmat-service (services/gmat-service) MUST NOT appear anywhere in this file --
# question 85 / docs/adr/003-substrate-and-deployment.md's 2026-09-02 amendment moved the
# deployed DynamicsService path to Rust precisely so grpcio/BoringSSL never has to reach a
# production profile, and Execution is the one profile that is actually deployed end to end.
# tests/test_profiles.py checks this mechanically (structurally, against the actual files on
# disk any component's `path` names -- not by pattern-matching this file's text) rather than
# relying on a human noticing an addition here.
id: execution
name: Execution profile
architecture_ref: 'docs/architecture.md section 5, "Configurability: four profiles", Execution column'
rule: "Profiles select components; they never change numerical behaviour (ADR-000 rule 1)."

# The globe's imagery source (M19.5, question 132 -- decided by the lead, applying
# question 11's rule: a profile selects *which* tile source the viewer points at, never
# how the viewer behaves once it has one). See profiles/design.yaml's own imagery entry
# for the full rationale; every profile defaults to the same offline fixture for now.
imagery:
  url_template: './fixtures/tiles/{z}/{x}/{y}.png'
  attribution: 'Offline fixture tiles (web/fixtures/gen_globe_tiles.py) -- no public basemap wired yet (question 132)'
  max_level: 2

dynamics_backend:
  - name: av-dynamics-service
    kind: rust_service
    path: crates/av-dynamics-service
    role: >-
      altavista.v1.DynamicsService, hosted in Rust (tonic over the OpenSSL-backed stack,
      GMAT through gmat-sys) -- present in every profile (question 85 / ADR-003's amendment);
      this is the profile the amendment was written for: Execution is deployed, and grpcio's
      bundled BoringSSL must never reach it.

# A1.2: the command authority policy this profile declares (docs/aiplane-plan.md milestone
# A1.2; docs/open-questions.md question 201(a)). `policy_dir` is a directory of `.rego`
# files, loaded and hashed by crates/av-command/src/policy.rs::PolicyBundle::load (sorted,
# deterministic order; a directory with no `.rego` file is a typed error, never an empty
# allow-everything bundle). `allow_entrypoint`/`deny_entrypoint` are carried here as
# configuration/documentation and checked against that module's own `ALLOW_ENTRYPOINT`/
# `DENY_ENTRYPOINT` constants (which is what `evaluate` actually queries today) so this
# profile's declared entry points can never silently drift from the evaluator's own -- see
# tests/test_profiles.py and crates/av-command/src/policy.rs's own test of this block.
# `rate_window_ns` is the trailing window width (nanoseconds) the ledger-backed rate source
# (crates/av-command/src/rate.rs::LedgerRateSource) counts recent per-class submissions over,
# fed into `PolicyInputRate.window_ns`.
authority:
  policy_dir: profiles/policies/authority
  allow_entrypoint: data.altavista.authority.allow
  deny_entrypoint: data.altavista.authority.deny
  rate_window_ns: 3600000000000  # 1 hour

planes:
  ingestion:
    per_architecture: "live edge plugins, HIL boards"
    components: []
    status: not_yet_built
    note: >-
      No edge-plugin or HIL-board ingestion component exists in this repository yet.
      ADR-005 (the simulation-kernel ADR that would define this runtime) is Proposed, not
      accepted -- this task's own instructions say not to implement its scheduler refactor,
      so this gap is named, not filled.

  hot_track:
    per_architecture: "live engine, SIL/HIL kernel"
    components:
      - name: av-kernel
        kind: rust_crate
        path: crates/av-kernel
        role: >-
          The live lockstep engine for BINDING_KIND_MODEL instances (a real GmatModel or the
          native ConstantAccelModel placeholder) -- crates/av-kernel/README.md's "Kernel<M>"
          and "The multi-rate scheduler" sections. This is the "live engine" half of the
          architecture.md cell.
    status: partial
    not_yet_built:
      - "SIL/HIL bindings: BINDING_KIND_CONTAINER, BINDING_KIND_RENODE and BINDING_KIND_BOARD are all explicitly refused today (crates/av-kernel/src/drm/binding.rs::classify_binding -> DrmError::UnsupportedBinding) -- ADR-005's runtime for any of the three is Proposed, not accepted, and this task's own instructions say not to implement its scheduler refactor."

  heavy_track:
    per_architecture: "tiling, ML batch"
    components: []
    status: not_yet_built
    note: "No tiling or ML-batch component exists in this repository yet."

  viewer:
    per_architecture: "live scene, command console"
    components:
      - name: web viewer
        kind: web_app
        path: web
        role: >-
          Live scene: the same frame graph + floating-origin viewer profiles/design.yaml
          lists (web/VIEWER.md) is capable of rendering a live-updating scene; nothing here
          claims a dedicated "live" mode beyond what that viewer already does.
        status: partial
    status: partial
    not_yet_built:
      - "A command console (the human-authorization UI for the Command plane's full path, below) does not exist in this repository yet."

  ai:
    per_architecture: "sidecars as tree nodes, proposals"
    components: []
    status: not_yet_built
    note: "No AI-plane sidecar isolation or proposal component exists in this repository yet -- architecture.md section 8 places this at phase P4."

  command:
    per_architecture: "full path"
    components:
      - name: av-command
        kind: rust_crate
        path: crates/av-command
        role: >-
          The command authority library (A1/A1.2, docs/aiplane-plan.md): the CommandState
          state machine (propose/check/authorize/dispatch/ack/reject/expire/fail, one
          transition function per edge, a typed refusal for every illegal edge), the
          durable hash-chained per-partition ledger, and Rego policy evaluation at CHECKED
          -- in process, via the `regorus` crate, over the `.rego` file(s) this profile's
          `authority` block above declares. `check_command` (crates/av-command/src/
          authority.rs) is the wired check edge: on allow it calls state::check and appends
          the CHECKED ledger record with the PolicyDecision attached; on deny it calls
          state::reject and appends the REJECTED record with the same PolicyDecision
          attached, so a denial is exactly as reproducible from the ledger as an approval.
    status: partial
    not_yet_built:
      - "A gRPC service exposing propose/check/authorize/dispatch/ack/query over the wire (A1.3, a separate task from A1.2 -- av-command is a library today, with no network-facing intake of any kind)."
      - "Principal, roles, MFA and time-limited delegations (A2) -- every check_command call today records the fixed principal \"policy\"; there is no OIDC/human-authorization layer."
      - "Dispatch into the kernel's real telecommand path with deadline/idempotency/ack levels (A3)."
      - "The AI-plane gateway/proposer and the command console panel (A4/A5) -- architecture.md section 8 places the AI plane and the command console at phase P4."
