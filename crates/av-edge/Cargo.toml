[package]
name = "av-edge"
publish = false
description = "E1 (docs/edge-plan.md): signed, chained, labelled `altavista.v1.MeasurementBatch`es -- canonical hashing, ECDSA P-384 signing/verifying against the system OpenSSL, per-producer clearance/label policy, and a pure hash-chain verifier with an injected clock (ADR-004's security boundary and evidence rules)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `altavista.v1::pb::{MeasurementBatch, BatchRejection, BatchVerdict, RejectionCounters,
# Label, Measurement, Provenance}` -- the shared prost build (`av_cdm::pb`), not a
# second, independently-generated copy from a build.rs in this crate (question 2's
# path-dependency convention; the manager's decision for this track).
av-cdm = { path = "../av-cdm" }
prost.workspace = true
thiserror.workspace = true

# ECDSA P-384 signing/verifying and SHA-256 hashing, against the system/Homebrew
# libssl+libcrypto -- deliberately NOT `sha2`/`ring`/any other crypto crate (ADR-004's
# crypto rule, verbatim; see `crates/av-dynamics-service/src/evidence.rs`'s module doc for
# the precedent this crate follows and `deny.toml`'s ban list for the mechanical check).
openssl = "0.10"

# E4 (`src/plugin.rs`): `PluginConfig` is serialisable (so a run can record exactly what
# it replayed under) and content-hashed (`PluginConfig::config_hash`, over its own
# canonical JSON bytes -- via `openssl::sha::sha256` above, never `sha2`). Both already
# workspace dependencies with the `derive` feature already enabled on `serde` at the
# workspace level; named directly here since `src/plugin.rs` derives `Serialize`/
# `Deserialize` and calls `serde_json::to_vec` itself.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `tests/plugin_replay.rs` cross-checks `crate::plugin::packet::decode_numeric_fields`
# against `av_kernel::codec::decode_packet` byte-for-byte, and loads the committed
# ground-segment fixture's own truth `Trajectory` to measure this plugin's decoded-vs-truth
# deviation (E5's own precondition). A **test-only** dependency, never a `[dependencies]`
# entry: `av-kernel` depends on `gmat-sys` (native GMAT FFI) and, transitively through
# `av-lockstep` -> `av-grpc`, on `tonic` -- exactly the GMAT/transport dependency this
# crate's own `src/plugin.rs` module doc explains `av-edge` itself must never gain, even
# indirectly. A test binary is never shipped and never becomes part of any other crate's
# own dependency tree, so this is safe here in a way it would not be as a real dependency.
av-kernel = { path = "../av-kernel" }
