[package]
name = "av-grpc"
publish = false
description = "M5.3: an OpenSSL-backed tonic client for altavista.v1.DynamicsService, and the test tool (describe_client) that proves mTLS through the gmat-service nginx front (ADR-004's crypto rule -- no ring in this crate's dependency tree)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
# M13.2: `Port`/`PortMessage` (proto/altavista/v1/system.proto, lockstep.proto) are shared,
# byte-identical wire types with `av_cdm::pb`'s own copies (`av_dynamics::PortMessage` is a
# type alias for `av_cdm::pb::PortMessage` -- see that crate's lib.rs). build.rs's
# `.extern_path` entries below make this crate's generated `pb::LockstepBindRequest`/
# `LockstepStepRequest`/`LockstepStepResponse` reference `av_cdm::pb::Port`/`PortMessage`
# directly instead of a second, independently-generated (structurally identical but
# nominally distinct) copy -- so `av-kernel`'s `Inbox`/`Outbox` messages cross the lockstep
# RPC boundary with no field-by-field conversion, the same pattern both build.rs files
# already use for `google.protobuf.Any` -> `prost_types::Any`.
av-cdm = { path = "../av-cdm" }

# tonic, default-features off: we only want the "channel" (client transport) half, never
# the "tls"/"tls-native-roots"/"tls-webpki-roots" features -- those pull `tokio-rustls`,
# which pulls `ring` (see tonic 0.12.3's Cargo.toml: the `tls` feature is the ONLY thing
# that brings in tokio-rustls; `channel` alone does not touch it). TLS for this crate's
# client is wired by hand below, through `openssl`/`hyper-openssl`, onto
# `Endpoint::connect_with_connector` -- see src/tls.rs.
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "channel"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
http = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
# OpenSSL-backed hyper connector (crates.io: sfackler/hyper-openssl). Links the `openssl`
# crate (openssl-sys -> the system/Homebrew libssl+libcrypto via OPENSSL_DIR), never
# BoringSSL and never `ring` -- see this crate's README/av-grpc module docs and the
# `cargo tree -p av-grpc | grep ring` evidence in services/gmat-service/README.md.
hyper-openssl = { version = "0.10", features = ["client-legacy", "tokio"] }
openssl = "0.10"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }
prost-build.workspace = true

[[bin]]
name = "describe_client"
path = "src/bin/describe_client.rs"
