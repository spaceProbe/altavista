[package]
name = "av-kernel"
publish = false
description = "The deterministic kernel skeleton (ADR-002/ADR-005 lockstep, Planned): a TAI-nanosecond clock authority, a multi-rate scheduler over DynamicsModel systems with Hermite-with-velocity interpolated output, and CDM v1 Trajectory assembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gmat"]
# `docs/open-questions.md` question 230 (the lead's ruling, round 4): the GMAT-backed half of
# this crate's `drm` module (`registry::construct_gmat`/`AnyModel::Gmat`, `drm::binding`'s
# `materialize_gmat`/`GmatModel`/`GmatModelInfo` plumbing, `drm::mod`'s `DrmError::Gmat`,
# `drm::executor`'s GMAT-frame-conversion functions, and the whole of `drm::gmat_command`) is
# behind this feature, mirroring `crates/av-orbital/Cargo.toml`'s own `gmat-frames` feature
# comment exactly (that crate's own precedent for this track): default-on, because every
# current caller (the DRM executor's own tests, `av-run`) wants the real GMAT engine until
# N6's additive `ModelKind` (a separate task) gives the kernel a native model to select
# instead; a kernel build that must omit `gmat-sys` entirely turns this off and still gets a
# crate that builds (`cargo test -p av-kernel --no-default-features`, this task's own report)
# with its non-GMAT `drm`/`schedule`/`kernel`/`trajectory`/`clock`/`interpolate` tests intact
# and a typed refusal (not a panic, not a silent native fallback) for any DRM instance whose
# `dynamics_model` names a `"gmat."`-prefixed id.
#
# N6 (`docs/native-dynamics-plan.md`, `docs/open-questions.md` question 230): also forwards to
# `av-orbital`'s own `gmat-frames` feature (its Cargo.toml's identical comment is this crate's
# own precedent) -- `av-orbital` is a normal, always-on dependency below (`default-features =
# false`), so its `EarthGravityModel`/`ModelKind::Orbital` dispatch is available in BOTH feature
# states; only the GMAT-backed half of *that* crate needs forwarding here. Verified by `cargo
# tree -p av-kernel --no-default-features -i gmat-sys`, not by reading: this task's own report
# has the output.
gmat = ["dep:gmat-sys", "av-orbital/gmat-frames"]

[dependencies]
av-cdm = { path = "../av-cdm" }
av-dynamics = { path = "../av-dynamics" }
# Question 205: the CCSDS Space Packet codec (formerly src/codec.rs) is now its own crate so
# `av-edge` can depend on it without pulling in `gmat-sys`. `src/lib.rs` re-exports it as
# `codec` so every `crate::codec::X` path in this crate is unchanged.
av-codec = { path = "../av-codec" }
# M6.1: the `drm` module binds BINDING_KIND_MODEL space-system instances to a real
# gmat_sys::model::GmatModel -- see src/drm/mod.rs's module doc comment for why this moved
# out of [dev-dependencies] (previously only tests/golden_acceptance.rs used it). Every other
# module (clock/interpolate/schedule/kernel/trajectory) still has no GMAT dependency.
# `optional = true` behind the `gmat` feature above (question 230): this is what lets
# `cargo build -p av-kernel --no-default-features` never touch `gmat-sys` (and therefore never
# need a linked GMAT) at all -- verified in this task's own report by `otool -L` on the built
# test binary and by `cargo tree -i gmat-sys` showing it absent from that feature state's graph.
gmat-sys = { path = "../gmat-sys", optional = true }
# N6 (`docs/native-dynamics-plan.md`): the native orbital force model behind the additive
# `ModelKind::Orbital` (`src/registry.rs`) -- `crate::drm::binding::AnyModel::Orbital` wraps its
# `EarthGravityModel<av_orbital::Fk5BodyFixedRotation>`. `default-features = false`: this crate's
# own default `gmat-frames` feature would pull `gmat-sys` in unconditionally, defeating the whole
# point of the `gmat` feature above -- forwarded explicitly instead (`gmat = [...,
# "av-orbital/gmat-frames"]`) so `--no-default-features` here really does leave `gmat-sys` out of
# the dependency graph (verified by `cargo tree`, this task's own report, not assumed from this
# comment). Unconditional (not `optional = true`): the native model must be constructible in
# EVERY feature state -- that is N6's whole point ("no GMAT library linked when the DRM selects
# it").
av-orbital = { path = "../av-orbital", default-features = false }
# M13.2 (question 107): the crate/drm/binding.rs's ContainerModel speaks
# altavista.v1.LockstepService (BINDING_KIND_CONTAINER) through this crate's tonic client --
# see crates/av-lockstep/src/lib.rs's own module doc comment for why it, not av-grpc
# directly, and for the OpenSSL-backed-mTLS-vs-plaintext-loopback split.
av-lockstep = { path = "../av-lockstep" }
serde.workspace = true
serde_json.workspace = true
# DRM authoring format (question 87): YAML, field-for-field mirroring the proto messages --
# see src/drm/schema.rs's module doc comment. Not already a workspace dependency, so pinned
# here with an explicit version per this task's own dependency rule.
serde_yaml = "0.9"
# SHA-256 for the DRM/SosConfiguration/SystemDefinition canonical hash (src/drm/hash.rs), via
# the `openssl` crate (openssl-sys -> the system/Homebrew libssl/libcrypto). Question 204
# migrated this off `sha2` (previously reused from `crates/av-dynamics` as an already-present
# workspace dependency) -- `sha2` is now banned workspace-wide in the root `deny.toml`'s
# `[bans]` list, per ADR-004's crypto rule: SHA-256 only, through the system OpenSSL only.
openssl = "0.10"
# Canonical protobuf encoding for hashing (src/drm/hash.rs): prost::Message::encode_to_vec.
# Already a transitive dependency via av-cdm/av-dynamics; named directly here since drm/hash.rs
# calls it explicitly.
prost.workspace = true
# A3.1 (src/drm/command_source.rs): `Command.payload`'s `google.protobuf.Any` carries a packed
# `google.protobuf.DoubleValue` -- a well-known type this crate already reaches transitively
# through av-cdm (whose own Cargo.toml already depends on it); named directly here since
# command_source.rs calls it explicitly, mirroring prost's own identical justification above.
prost-types.workspace = true

[dev-dependencies]
# M24.4c: crates/av-kernel/tests/drm_attitude_control_renode.rs spawns the real
# av-lockstep-shim binary as a plain child process (fronting the Renode bridge) exactly the way
# services/cfs does in production. A path dev-dependency makes Cargo build it before this
# crate's tests run (`CARGO_BIN_EXE_av-lockstep-shim` itself is NOT set this way -- Cargo only
# sets that for a binary target of the SAME package as the integration test, confirmed by
# actually trying it; that test locates the built binary next to its own test executable
# instead -- see its own `shim_bin_path` doc comment). Not a [dependencies] entry: av-kernel's
# own library code never links against the shim binary, only this one test spawns it
# out-of-process.
av-lockstep-shim = { path = "../av-lockstep-shim" }
# Question 205: `tests/edge_plugin_codec_crosscheck.rs` cross-checks
# `av_edge::plugin::packet::decode_numeric_fields` against this crate's own `codec::
# decode_packet` (moved from `crates/av-edge/tests/plugin_replay.rs` -- `av-edge` may not
# build `gmat-sys`, so the one test in that file needing `av_kernel` had to move here
# instead). Test-only, like `av-lockstep-shim` above: `av-edge` depends on neither
# `av-kernel` nor `gmat-sys` (question 205's whole point), so this edge is dev-only and one
# way, never a cycle.
av-edge = { path = "../av-edge" }

# `docs/open-questions.md` question 230: every integration test/example below actually calls
# into the GMAT-backed half of this crate (a live `Gmat` engine, `materialize_gmat`,
# `AnyModel::Gmat`, or a `"gmat."`-dispatched `execute()` run) -- measured with
# `grep -rl gmat_sys crates/av-kernel/tests crates/av-kernel/examples` and then re-checked file
# by file, not trusted from the grep alone: `tests/state_space_declaration.rs` also matches that
# grep (one doc-comment mention, `gmat_sys::engine_lock()`, in its own module doc) but never
# calls `classify_binding`/`execute` against a `"gmat."` dynamics_model in a way that needs a
# live engine, so it is deliberately left off this list and out of `[[test]]` entirely (plain
# autodiscovery covers it in both feature states). `required-features = ["gmat"]` -- not an
# inner `#![cfg(feature = "gmat")]` in each file -- because an inner `cfg` that evaluates false
# still produces a linked, empty test binary, and this host's `syspolicyd` blocks for one to
# three minutes per FRESHLY LINKED binary regardless of what it actually runs
# (`docs/open-questions.md` question 226): 35 empty binaries would be roughly an hour of nothing.
# `required-features` means cargo does not build these targets at all under
# `--no-default-features` -- confirmed by listing the test binaries cargo actually produces in
# each feature state (`cargo test --no-run --message-format=json`), not assumed. Declaring these
# named `[[test]]` entries does not disable autodiscovery of the remaining, non-GMAT test files
# (`cargo help cargo-test`'s own documented behaviour, re-confirmed here): only the files listed
# below stop being built without the feature; every other file in `tests/` is unaffected.
[[test]]
name = "covariance_frame_conversion"
required-features = ["gmat"]
