# Question 258's guard: the platform's transcendental functions may not return to the native run
# path. Every one of them goes through `av_dynamics::math` (the pure-Rust `libm` crate), which is
# what makes a native run's bytes the same on macOS, Linux aarch64 and Linux x86_64 (question 248
# measured Apple's libm and glibc one ulp apart). The lint is denied outside `cfg(test)` by the
# crate's own attributes (`docs/native-dynamics-plan.md`, question 258's round); test code, and the
# package's integration tests and examples, keep `std` as reference values. `sqrt` and `powi` are
# deliberately absent: `sqrt` is correctly rounded by IEEE 754, `powi` is not a libm function.
# The same list is in crates/av-dynamics, crates/av-orbital and crates/av-kernel; keep them equal.
disallowed-methods = [
    { path = "f64::sin", reason = "use av_dynamics::math::sin (question 258)" },
    { path = "f64::cos", reason = "use av_dynamics::math::cos (question 258)" },
    { path = "f64::sin_cos", reason = "use av_dynamics::math::sin_cos (question 258)" },
    { path = "f64::tan", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::asin", reason = "use av_dynamics::math::asin (question 258)" },
    { path = "f64::acos", reason = "use av_dynamics::math::acos (question 258)" },
    { path = "f64::atan", reason = "use av_dynamics::math::atan (question 258)" },
    { path = "f64::atan2", reason = "use av_dynamics::math::atan2 (question 258)" },
    { path = "f64::sinh", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::cosh", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::tanh", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::asinh", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::acosh", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::atanh", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::exp", reason = "use av_dynamics::math::exp (question 258)" },
    { path = "f64::exp2", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::exp_m1", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::ln", reason = "use av_dynamics::math::ln (question 258)" },
    { path = "f64::ln_1p", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::log", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::log10", reason = "use av_dynamics::math::log10 (question 258)" },
    { path = "f64::log2", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f64::powf", reason = "use av_dynamics::math::powf (question 258)" },
    { path = "f64::hypot", reason = "use av_dynamics::math::hypot (question 258)" },
    { path = "f64::cbrt", reason = "add it to av_dynamics::math (question 258)" },
    { path = "f32::sin", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::cos", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::sin_cos", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::tan", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::asin", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::acos", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::atan", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::atan2", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::exp", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::ln", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::log10", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::powf", reason = "native maths is f64 through av_dynamics::math (question 258)" },
    { path = "f32::hypot", reason = "native maths is f64 through av_dynamics::math (question 258)" },
