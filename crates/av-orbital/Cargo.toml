[package]
name = "av-orbital"
publish = false
description = "N1 (docs/native-dynamics-plan.md): the GMAT-free numerical core of the native orbital force model behind ADR-002's depth-3 native Rust models -- a .cof gravity-file reader, normalised associated Legendre recursion stable to degree 70, and point-mass/spherical-harmonic gravity acceleration with analytic partials in the body-fixed frame. No frame rotation, no DynamicsModel impl and no goldens here (the second N1 worker's half); no gmat-sys dependency, so this crate builds without GMAT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]
# ADR-004's crypto rule: SHA-256 only, through the system OpenSSL, never `sha2`/`ring` --
# used by `src/cof.rs`'s own `#[cfg(test)]` module (see that module's doc) to pin GMAT's own
# `.cof` gravity data-pack files against a committed digest, matching the identical
# `openssl = "0.10"` pin already carried by `crates/av-edge/Cargo.toml` and
# `crates/av-store/Cargo.toml` (question 204's precedent, not a new dependency choice).
#
# A DEV-dependency, not a dependency (manager's N1a review): the only use of it in this crate
# is inside `#[cfg(test)]`, and this crate's whole purpose is to be the portable half that a
# kernel built without GMAT can carry (N5/N6). A normal dependency would make every downstream
# consumer link the system OpenSSL for a digest none of them computes.
openssl = "0.10"

# Deliberately NOT a dependency: `av-dynamics` (question: "only if you actually use it").
# This half of N1 is the pure numerical core -- a .cof reader, the Legendre recursion, and
# body-fixed gravity acceleration/partials -- and never touches `DynamicsModel`, `ErasedModel`,
# `Dopri5` or CDM state types; nothing here needs `av-cdm` or `av-dynamics` at all. The second
# N1 worker wires this crate's `GravityModel`/`legendre`/`gravity` functions into a
# `DynamicsModel` impl in a crate that *does* depend on `av-dynamics`, per the assignment brief.
# `sha2` (ADR-004 ban; `deny.toml`'s `[bans]` list) and any new crypto crate are not
# considered at all, per the same rule.
