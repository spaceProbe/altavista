[lib]
# N6 deliverable 1 (`docs/native-dynamics-plan.md`): the C ABI export of the native derivative
# function (question 9's hedge, ADR-002's "portable form") needs a `staticlib` artifact for a
# C caller to link against. `rlib` stays first and is NOT dropped -- every existing in-workspace
# consumer of this crate (`av-kernel`'s eventual N6 `ModelKind`, this crate's own `tests/*.rs`
# integration tests, `crates/av-dynamics`'s dev-dependents, if any) links it as an ordinary Rust
# rlib, and Cargo only emits the crate-types actually listed here -- dropping `rlib` would break
# every such consumer at the next `cargo build --workspace`. Verified by building the whole
# workspace after this change (this task's own report has the command and output), not merely
# by reading this comment.
crate-type = ["rlib", "staticlib"]

[package]
name = "av-orbital"
publish = false
description = "N1 (docs/native-dynamics-plan.md): the native orbital force model behind ADR-002's depth-3 native Rust models -- a .cof gravity-file reader, normalised associated Legendre recursion stable to degree 70, point-mass/spherical-harmonic gravity acceleration with analytic partials in the body-fixed frame (the first N1 worker's half), plus the body-fixed-to-inertial rotation, the av_dynamics::DynamicsModel binding for a single spacecraft, and the two-body analytic golden (the second N1 worker's half, this crate as of that task). The GMAT-backed rotation is behind the `gmat-frames` cargo feature (default-on): with it disabled, this crate still builds and its non-GMAT tests still pass, so a kernel built without gmat-sys can still carry this crate's pure-numerical and DynamicsModel-generic code (the N5/N6 portability hedge, made real now at little cost)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gmat-frames"]
# The GMAT-backed `BodyFixedRotation` impl (`src/frame_gmat.rs`) and every test that needs a
# real GMAT engine. Default-on because every current caller (the DRM executor, the N1b tests)
# wants the GMAT-validated rotation charter decision 222(c) calls for until N5 replaces it
# natively; a kernel build that must omit `gmat-sys` entirely turns this off and still gets a
# crate that builds and unit-tests cleanly (`cargo test -p av-orbital --no-default-features`,
# verified in this task's own report) -- `EarthGravityModel<R>` itself is generic over any
# `R: BodyFixedRotation`, so it needs no feature gate at all; only the GMAT-backed `R` does.
gmat-frames = ["dep:gmat-sys"]

[dependencies]
thiserror.workspace = true

# `av_dynamics::DynamicsModel`/`StepResult`/`integrate::Dopri5`/`settings_hash` for
# `src/model.rs`'s `EarthGravityModel` -- this half of N1 (unlike the first half) genuinely
# implements the contract, so this is a real dependency now, not the "deliberately not a
# dependency" the first half's Cargo.toml comment recorded (question: "only if you actually
# use it" -- this crate now does). `av-dynamics` itself has no GMAT dependency (its own module
# doc: "this crate must build, and be unit-tested, in an environment that has never linked
# GMAT"), so pulling it in unconditionally does not compromise the `--no-default-features`
# build this crate's own feature gate protects.
av-dynamics = { path = "../av-dynamics" }
# `av_cdm::pb::ModelInfo`/`ModelCapability` for `describe()`, and `av_cdm::time::Tai` for the
# TAI-nanoseconds <-> A.1 Modified Julian Date epoch conversion `src/frame_gmat.rs` needs at
# the `Gmat::convert_with_rotation` boundary (identical conversion `av-kernel`'s own executor
# uses -- `Tai::from_nanos(t_tai_ns).to_a1_mjd()`). No GMAT dependency of its own either.
av-cdm = { path = "../av-cdm" }
# ADR-004's crypto rule: SHA-256 only, through the system OpenSSL, never `sha2`/`ring`. Was a
# dev-dependency through the first N1 worker's half (used only by `src/cof.rs`'s own
# `#[cfg(test)]` data-pack pin); promoted to a real dependency here because
# `src/model.rs::EarthGravityModel::new` now hashes the bound gravity file's own bytes into
# `ModelInfo.settings_hash`'s input at construction time (not merely in a test) -- the
# settings hash must cover "the gravity file NAME, its SHA-256, degree, order, mu, reference
# radius, the frame names, and the integrator settings" per this task's brief, and a SHA-256
# of the file's own bytes is not something `av_dynamics::settings_hash` (which hashes a
# caller-supplied `BTreeMap<String, String>`, not a file) can produce on its own. Same pin
# already carried by `crates/av-edge/Cargo.toml`/`crates/av-store/Cargo.toml` (question 204's
# precedent, not a new dependency choice).
openssl = "0.10"

# The GMAT-backed `BodyFixedRotation` (`src/frame_gmat.rs`), behind the `gmat-frames` feature
# above -- `optional = true` is what lets that feature control whether this edge even exists,
# so `cargo build -p av-orbital --no-default-features` never touches `gmat-sys` (and therefore
# never needs a linked GMAT) at all.
gmat-sys = { path = "../gmat-sys", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
