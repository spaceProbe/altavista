[package]
name = "av-dynamics"
publish = false
description = "The shared dynamics contract and integrator (ADR-002): DynamicsModel trait, Dopri5. No GMAT dependency -- must build without GMAT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
av-cdm = { path = "../av-cdm" }
# SHA-256 for `settings_hash`, via the `openssl` crate (openssl-sys -> the system/Homebrew
# libssl/libcrypto) -- question 204 migrated this off `sha2` (banned workspace-wide, see the
# root `deny.toml`'s `[bans]` list) to close the gap ADR-004's crypto rule always intended:
# SHA-256 only, through the system OpenSSL only, with no carve-out for a non-security-critical
# fingerprint like this one.
openssl = "0.10"
# Question 258: the pure-Rust libm behind `av_dynamics::math`, the one module every transcendental
# call on the native run path goes through, so a native run's bits do not depend on the platform's
# libm (question 248). MIT; already in the lockfile through `num-traits`, so no new fetch.
# Default features (`arch`) only route `sqrt`/`fma`/`rint` to hardware instructions, all exact or
# correctly rounded.
libm = "0.2.16"

# Question 258: `clippy::disallowed_methods` (the platform transcendentals listed in this crate's
# clippy.toml) is allowed package-wide so test code, integration tests and examples keep `std` as
# reference values, and denied by the crate's own attributes outside `cfg(test)` on the native path.
[lints.clippy]
disallowed_methods = "allow"
