[package]
name = "av-sweep"
publish = false
description = "F1a (docs/feasibility-plan.md): pure, GMAT-free sweep grid expansion, per-sample seed derivation and per-sample DRM/SOS configuration for the feasibility-mode parameter sweep executor. Library only -- the process-parallel executor and CLI binary are F1b."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
av-cdm = { path = "../av-cdm" }
# Reused for its DRM/SOS/SystemDefinition YAML loader (av_kernel::drm::schema) and canonical
# hashing (av_kernel::drm::hash) -- this crate's own schema.rs/hash.rs build directly on top
# of those rather than reimplementing DRM/SOS parsing or hashing a second time (see this
# crate's REPORT.md and each module's own doc comment for exactly what is reused vs.
# transcribed locally, and why).
av-kernel = { path = "../av-kernel" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
# DRM/sweep authoring format, matching crates/av-kernel/Cargo.toml's own pin exactly (question
# 87's convention, mirrored here for ParameterSweep/SweepAxis YAML) -- not a workspace
# dependency, so pinned here with the same explicit version av-kernel already uses.
serde_yaml = "0.9"
sha2.workspace = true
thiserror.workspace = true
