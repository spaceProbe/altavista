syntax = "proto3";

// One DRM run's products as a declared CDM message (ADR-001: nothing exists only as a
// native type; question 121). This is the wire form of the kernel's `RunProducts`
// (`crates/av-kernel/src/drm/executor.rs`, question 93): the same unmodified
// Trajectory / Event / Provenance messages that were previously concatenated by hand.
//
// A RunProducts is reproducible from its provenance: `provenance.config_hash` is the DRM
// hash, `provenance.run_id` names the run, and every trajectory and event carries its own
// provenance so a consumer can verify each part independently.
package altavista.v1;

import "altavista/v1/core.proto";
import "altavista/v1/system.proto";
import "altavista/v1/trajectory.proto";

// One evaluated Objective or MeasureOfEffectiveness (ADR-005 §6).
message ScoreResult {
  // Objective.name or MeasureOfEffectiveness.name.
  string name = 1;
  double value = 2;
  Unit unit = 3;
  // Set for an Objective (|value - target| <= tolerance); unset for a measure of
  // effectiveness, which has no pass criterion.
  optional bool passed = 4;
}

message RunProducts {
  string run_id = 1;
  // One per SystemInstance, keyed by SystemInstance.id.
  map<string, Trajectory> trajectories = 2;
  // Sorted (tai_ns, id), the executor's own order.
  repeated Event events = 3;
  // Keyed by score name.
  map<string, ScoreResult> scores = 4;
  Provenance provenance = 5;
  // Count of in-flight port messages dropped at end_tai_ns (question 117); zero when the
  // run drained naturally. Also present in provenance.attributes for older consumers.
  uint64 dropped_in_flight_messages = 6;
  // Frame definitions every Trajectory.frame_id in this bundle resolves against
  // (question 122): the DRM's Scenario.frames plus the registry defaults the producer
  // used. A consumer needs nothing outside the bundle to place a trajectory.
  repeated FrameDefinition frames = 7;
  // Question 173: measurements produced during the run (telemetry decoded by the declared
  // PacketCodecs into CDM Measurements, sensor outputs), sorted (epoch_ns, measurement_id).
  // A measurement is its own CDM type; it is never smuggled into an Event's attributes.
  repeated Measurement measurements = 8;
  // Question 175: SHA-256 of the run's PortTrafficLog sidecar (below), empty when the run
  // recorded no port traffic. The sidecar's location is in provenance.attributes
  // ["port_traffic_uri"]; the hash is what a replay verifies against.
  string port_traffic_hash = 9;
  // Question 242: the real-time pacing report. Present only for a run whose clock was slaved
  // to wall time (some instance bound to a board, ADR-005 section 2); absent (unset, so no
  // bytes on the wire) for a lockstep run, whose encoding is therefore exactly what it was
  // before this field existed. One of the run's two wall-clock-dependent products: the other
  // is the per-overrun Event (name "pacing_overrun", id prefix "marker:pacing:overrun:") in
  // `events`; a replay excludes exactly those two (av-kernel `pacing::WALL_CLOCK_DEPENDENT`).
  PacingReport pacing = 10;
}

enum PacingMode {
  PACING_MODE_UNSPECIFIED = 0;
  // The default: no wall-clock read, the run is a pure function of its ordered inputs.
  PACING_MODE_LOCKSTEP = 1;
  // The kernel clock is slaved to wall time at 1:1 and every deviation is counted.
  PACING_MODE_REAL_TIME = 2;
}

// What real-time pacing measured over one run (question 242, ADR-005 sections 2 and 4). The
// schedule is anchored once: wall time W0 is the instant the run's first tick was released,
// mapped to the scenario start; sim time t is due at W0 + (t - start) at 1:1. A tick whose
// work finishes after its deadline is an overrun (finish - deadline); the next tick is
// released at its own scheduled time, or immediately if that has passed, so a late run
// catches up without skipping a step and without re-anchoring.
message PacingReport {
  PacingMode mode = 1;
  // The scheduler's base period the run was paced at (ADR-005 section 2), in nanoseconds.
  int64 base_period_ns = 2;
  // The instances that forced real-time pacing (those bound to a board), sorted.
  repeated string forcing_instances = 3;
  // The wall-clock instant (UNIX epoch nanoseconds) the schedule was anchored at, and the
  // scenario start (TAI ns) it was mapped to. For forensics only: nothing derives from it.
  int64 wall_start_unix_ns = 4;
  int64 sim_start_tai_ns = 5;
  // Ticks paced (a tick is one scheduler epoch; a span boundary or a catch-up step ahead of an
  // output tick belongs to the tick it serves and is counted once).
  uint64 ticks_paced = 6;
  // Ticks whose work finished after their deadline.
  uint64 overrun_count = 7;
  // The largest overrun and the sim epoch (TAI ns) of the tick it happened at; both 0 with no
  // overrun.
  int64 worst_overrun_ns = 8;
  int64 worst_overrun_tai_ns = 9;
  // The sum of every overrun.
  uint64 total_overrun_ns = 10;
  // Overrun histogram. `overrun_histogram[i]` counts overruns in (edge[i-1], edge[i]] with
  // edge[-1] = 0; the final element (one more than there are edges) counts overruns above
  // the last edge. The edges are fixed by the kernel and sent so a reader needs none.
  repeated int64 overrun_histogram_upper_edges_ns = 11;
  repeated uint64 overrun_histogram = 12;
  // Work time per tick (from release to finish, summed over the tick's segments).
  int64 worst_work_ns = 13;
  int64 mean_work_ns = 14;
  uint64 total_work_ns = 15;
  // The run's lateness at its end: the last tick's finish against W0 + (end - start), floored
  // at 0. Zero means the run ended on or before its wall-clock schedule.
  int64 final_lateness_ns = 16;
}

// One frame as it crossed a port during a run (question 175): the raw bytes the router
// carried, with the sender, the port, the direction relative to that instance, and the
// emission epoch. Recorded by the executor for every FRAMED and BYTE_STREAM port, so a run
// replays with any bound process replaced by a replay binding that plays these back.
message PortTrafficRecord {
  string instance = 1;
  string port = 2;
  PortDirection direction = 3;
  int64 tai_ns = 4;
  bytes payload = 5;
  // Step sequence within the run at which the frame was carried.
  uint64 sequence = 6;
}

// The run's port traffic, written as a sidecar beside the RunProducts rather than inside
// them: framed traffic at step rate is orders of magnitude larger than the products. Sorted
// (tai_ns, sequence, instance, port): epoch first, because frames the router carried before
// the first output tick (declared command dispatches) have sequence 0 while their epoch is
// mid-run (question 181); a reader keyed on epoch sees a monotonic log. Hashed as a whole;
// the hash lives in RunProducts.port_traffic_hash.
message PortTrafficLog {
  string run_id = 1;
  repeated PortTrafficRecord records = 2;
  Provenance provenance = 3;
}

// One sample of a feasibility study (question 191): one point of the ParameterSweep's grid
// and one Monte Carlo draw at that point, run through the executor as its own run.
message SweepSample {
  // Row-major index into the sweep grid, then the draw index.
  uint32 point_index = 1;
  uint32 draw_index = 2;
  // "instance.parameter" -> the value applied at this point.
  map<string, double> axis_values = 3;
  // Field 4 was a single derived seed; Scenario.seeds is a map, so the derived seeds are a
  // map too (field 10). Reserved so the old shape cannot return.
  reserved 4;
  reserved "seed";
  string run_id = 5;
  // The per-sample configuration hash: SHA-256 over the length-prefixed canonical
  // serializations of the DRM, the SosConfiguration and every SystemDefinition, with this
  // point's axis values applied (axis values land on SystemInstance.overrides in the SOS or
  // on a Scenario event, so the DRM hash alone would not change).
  string config_hash = 6;
  map<string, ScoreResult> scores = 7;
  // Where this sample's RunProducts and sidecars were written, when kept.
  string products_uri = 8;
  // Set when the run failed: the typed error's text; scores are then empty.
  string error = 9;
  // Every seed this draw ran with, keyed like Scenario.seeds: each derived from the base
  // seed under that key, the sweep hash, the point and the draw; recorded so the sample
  // replays alone with exactly the stochastic inputs it had.
  map<string, uint64> seeds = 10;
}

// Aggregate of one score across the draws at one grid point.
message ScoreAggregate {
  string name = 1;
  uint32 point_index = 2;
  uint32 draws = 3;
  double mean = 4;
  double std_dev = 5;
  double min = 6;
  double max = 7;
  // Fraction of draws whose Objective passed; unset for a measure of effectiveness.
  optional double pass_fraction = 8;
}

// The products of a feasibility study (question 191): every sample, the aggregates, and the
// provenance that makes the whole study reproducible from the sweep hash and the seeds.
message SweepResults {
  string sweep_id = 1;
  string sweep_hash = 2;
  string drm_hash = 3;
  repeated SweepSample samples = 4;
  repeated ScoreAggregate aggregates = 5;
  Provenance provenance = 6;
}
