syntax = "proto3";

// Command authority: the policy input/decision shape evaluated at CHECKED, and one record
// of the durable, hash-chained command ledger (ADR-004; `docs/open-questions.md` question
// 201; `docs/aiplane-plan.md` milestone A1). This track owns this file; `command.proto` and
// every other shared proto stay additive-only under `buf breaking` (this track never edits
// them).
//
// Scope of what this file defines, by milestone -- so the next worker does not invent a
// second shape for something already planned:
//   - A1 (this file, as committed by this task): `PolicyInput`, `PolicyDecision`,
//     `LedgerRecord` below. Nothing about *how* a policy is loaded or *who* a principal is.
//   - A1.2 will add policy bundle metadata (a bundle id/hash, the `.rego` file(s) in effect,
//     the evaluator's own version) as its own message(s), referenced from `PolicyDecision`
//     by id rather than folding new fields into `PolicyDecision`/`PolicyInput` directly.
//   - A2.1 (this task, additive only -- no field number above moves): `Principal` below,
//     the secsso claims contract (question 34, question 201(b)): `sub`, `groups`, `amr`,
//     `acr`, issuer, audience, `jti`, and issued-at/expiry as TAI nanoseconds. Filled only by
//     a successful `crates/av-command/src/oidc.rs` verification against a configured issuer
//     and the injected clock -- there is no path that constructs one from an unverified
//     token. `CommandAuthorityService.Authorize` (`crates/av-command/src/service.rs`) now
//     verifies `AuthorizeRequest.principal_token` and records the verified `Principal.sub` as
//     `CommandTransition.principal`.
//   - A2.2 (this task, additive only -- no field number above moves): `RoleBinding` and
//     `Delegation` below, plus the role/MFA/delegation gate itself on `Authorize`
//     (`crates/av-command/src/authz.rs`). A2.1 verifies *who* the caller is; A2.2 decides
//     *whether* that caller may authorize a given command class. `CommandTransition.
//     delegation_id` (`command.proto`) is recorded by A2.1 exactly as it was before --
//     unevaluated by A2.1 itself -- and is now what A2.2 enforces expiry/scope against, at
//     the injected clock. **No new "authorization decision" message was added**: unlike
//     `PolicyDecision` (A1.2, a `CHECKED`-time record this crate's own ledger needs to carry
//     alongside the transition, because a policy decision has structure worth keeping --
//     reasons, a rule path, the input it saw), A2.2's outcome fits entirely in fields
//     `command.proto` already has: `CommandTransition.principal` (the verified subject,
//     A2.1), `CommandTransition.delegation_id` (which delegation, if any) and
//     `CommandTransition.reason` (`crates/av-command/src/authz.rs`'s `format_authz_reason` --
//     which role granted it, or which delegation; the MFA outcome). A denial never reaches
//     the ledger as a `CommandTransition` at all (no state edge is attempted until
//     authorization succeeds), so there is no denial-carrying counterpart to `PolicyDecision`
//     needed either -- the audit line (`crates/av-command/src/audit.rs`) is where a denied
//     attempt is recorded, from the typed refusal directly, not from a new message here.
//   - A1.3 (additive only -- no field number above moves): `CommandAuthorityService`
//     and its request/response messages, below `LedgerRecord`. `AuthorizeRequest.
//     principal_token`/`delegation_id` are the two fields A2 needs on the wire; A2.1's
//     service implementation (`crates/av-command/src/service.rs`) now verifies
//     `principal_token` for real (see above) but performs no role/MFA/delegation gate --
//     that is A2.2's job, not earned by this task.
//   - A4a (additive only -- no field number above moves; `docs/aiplane-plan.md` milestone
//     A4, `crates/av-gateway`): `RunIdentity`, `GatewaySelector`, `GatewayQueryRequest`/
//     `GatewayQueryResponse`, `DataGatewayService` and `ProposalEvidence` below. A read-only
//     surface over run products (trajectories, events, scores, measurements) plus an MCP
//     `propose_command` tool that can create `PROPOSED` and nothing else
//     (`crates/av-gateway/src/propose_only.rs`); it neither adds nor changes any command-
//     authority state edge above, and does not touch `LedgerRecord`'s own field set (adding
//     a field there would break `crates/av-command/src/ledger.rs`'s exhaustive struct
//     literal in a crate this track does not edit -- see `crates/av-gateway/src/
//     evidence.rs`'s module doc for how the evidence topic is realized instead).
//   - A4b (additive only -- no field number above moves; `docs/aiplane-plan.md` milestone
//     A4, `crates/av-proposer`): `ProposeCommandRequest`/`ProposeCommandResponse` and
//     `ModelProposeService` below. A4a's `propose_command` exists only as an MCP tool over
//     stdio (`crates/av-gateway/src/mcp.rs`); a containerised proposer that talks to the
//     gateway over a real network socket (this milestone's whole point -- the proposer runs
//     isolated, `--network none` plus the gateway endpoint, R2's decision 11) has no propose
//     path at all without one. This is a SECOND service, deliberately not a new rpc on
//     `DataGatewayService`: that service's own doc comment states, as a load-bearing
//     invariant this track relies on elsewhere, that nothing in it can create a `Command` --
//     adding a propose rpc there would falsify that sentence for every caller of
//     `DataGatewayService`, not only the proposer. It is also deliberately not a second,
//     home-rolled MCP-over-TCP transport: this workspace's MCP server is hand-rolled
//     JSON-RPC 2.0 over stdio precisely because stdio needs no listening socket (round 2's
//     decision 10; question 154), and a proposer dialing the gateway over a real socket is
//     exactly the case that guarantee does not cover -- an ordinary additive gRPC service,
//     on the same transport stack every other service in this workspace already uses, is the
//     honest fit, not a second bespoke protocol. `ProposeCommandRequest` carries exactly what
//     `crates/av-gateway/src/mcp.rs::handle_propose_command` already accepts (the command
//     fields, rationale, evidence ids, the run identity and query ids `ProposalEvidence`
//     needs, the model identity and version, the proposing principal) and
//     `ProposeCommandResponse` exactly what it returns; both surfaces call through ONE shared
//     implementation, `crates/av-gateway/src/propose_flow.rs` -- see that module's own doc.
//     Served by `av-gateway`, on the same `tonic::transport::Server` (and therefore the same
//     port) as `DataGatewayService` -- two `add_service` calls on one server, never a second
//     listening socket.
//   - R3.5a (additive only -- no field number above moves; `docs/aiplane-plan.md` milestone
//     A5, the command console's server half): `LedgerRecord.proposal` (field 12) and
//     `QueryResponse.proposals`/`QueryResponse.decisions` (fields 2/3) below. Fixes the
//     defect that `CommandAuthorityServiceImpl::propose` accepted `CommandProposal.
//     rationale`/`evidence_ids` on the wire and never persisted either anywhere -- "proposals
//     with their rationale and evidence" (A5's own milestone text) could not be served at
//     all before this round. See each field's own doc comment above for the exact
//     self-evidence invariant `Ledger::append` now enforces on `proposal`, mirroring
//     `LedgerRecord.command`'s (field 11) identical, already-enforced invariant.
package altavista.v1;

import "altavista/v1/command.proto";
import "altavista/v1/envelope.proto";
// A4a only: the run-product types the gateway serves (Trajectory/Event from
// trajectory.proto, ScoreResult from run.proto, Measurement from core.proto) -- named
// individually rather than importing a whole `RunProducts` value; see
// `crates/av-gateway/src/catalogue.rs`'s module doc for why `RunProducts` itself is never
// the wire shape a query returns (label enforcement: `RunProducts` carries no `Label` of
// its own to check).
import "altavista/v1/core.proto";
import "altavista/v1/run.proto";
import "altavista/v1/trajectory.proto";

// The recent-command-rate section of `PolicyInput`. Carries raw counts and the window's
// width, not a pre-divided rate: the policy decides which class it rate-limits and what
// threshold applies, this message only supplies the facts (`docs/aiplane-plan.md` A1: "the
// rate of recent commands per class").
message PolicyInputRate {
  // Recent command count, per `Command.command_class`, in the trailing window ending at
  // `PolicyDecision.evaluated_tai_ns`. Keys are `command_class` values, e.g. "burn", "mode".
  map<string, uint64> counts_by_class = 1;
  // Width of the trailing window, nanoseconds.
  int64 window_ns = 2;
}

// The exact input document the Rego policy at CHECKED is evaluated over (ADR-004's "Command
// authority" section: "OPA policy at CHECKED (label, asset, envelope, rate)"). Shaped so it
// serializes to the identical JSON document an out-of-process OPA binary would receive --
// question 201(a): the in-process `regorus` evaluator and a deployed OPA are meant to be
// interchangeable against the same policy without a second input shape.
message PolicyInput {
  // The `Command.id` being evaluated.
  string command_id = 1;
  // `Command.entity_id` -- the asset the command targets.
  string entity_id = 2;
  // `Command.command_class` -- the unit of authorization policy.
  string command_class = 3;
  // `Command.hazardous`.
  bool hazardous = 4;
  // `Command.envelope_id`. Empty until an envelope policy exists (question 53: propose-only
  // stands for this whole track) -- carried here so a policy fixture can exercise "refuse
  // any envelope" (`docs/aiplane-plan.md` A1's test list) even though nothing ever sets it
  // to a non-empty value in this track's own code.
  string envelope_id = 5;
  Label label = 6;
  PolicyInputRate rate = 7;
}

// The result of evaluating a `PolicyInput` against the effective policy. `decision_id` and
// `policy_hash` are written into the CHECKED `CommandTransition.reason` (`docs/aiplane-
// plan.md` A1: "the decision id and the policy hash go into the transition's reason"), so a
// replay can find this exact decision back in the ledger by reason text alone.
message PolicyDecision {
  // Deterministic: a content id derived from (policy_hash, the PolicyInput's own canonical
  // encoding, evaluated_tai_ns) -- never a randomly generated id (this crate generates no
  // ids at random anywhere; see `crates/av-command/src/ledger.rs`'s module doc for why).
  string decision_id = 1;
  bool allow = 2;
  // SHA-256 hex of the effective policy bundle (the `.rego` source(s) that produced this
  // decision). A1 reserves this field's meaning; A1.2 wires it from the real bundle loader.
  string policy_hash = 3;
  // Human-readable reasons the policy evaluator gave, in the order it gave them.
  repeated string reasons = 4;
  // Dotted rule path the decision resolved from, e.g. "data.altavista.command.allow".
  string matched_rule_path = 5;
  // When the decision was made, nanoseconds on TAI, always from the injected Clock
  // (`crates/av-command/src/clock.rs`) -- never the wall clock read directly.
  int64 evaluated_tai_ns = 6;
  // The exact `PolicyInput` this decision was evaluated over (A1.2, additive). Carried on
  // the decision itself -- not just referenced -- so a replay can re-evaluate the recorded
  // input against a freshly loaded bundle and reproduce `decision_id`/`allow`/`policy_hash`/
  // `reasons` from the ledger alone, without needing any other source to reconstruct what
  // was actually evaluated (`crates/av-command/src/policy.rs`'s module doc, "Reproducibility
  // from the ledger").
  PolicyInput input = 7;
}

// One record of the durable, per-partition command ledger (ADR-004, "Evidence, verbatim
// from P0": "for the engine and command services the durable log itself is the ledger,
// chained per partition"). `partition` is the entity id: every record belonging to one
// entity lives in exactly one partition's chain, one file, in strictly increasing `seq`
// order; a different entity's records never interleave into the same chain.
//
// Chaining convention -- mirrors `envelope.proto`'s `SignedBatch.prev_hash`/`hash` exactly
// (restated here, not reused, since this is a distinct message in a distinct partitioned
// log rather than `SignedBatch`'s own per-producer batch chain):
//   - `prev_hash` is the previous record's own `hash` in this same partition, or the literal
//     ASCII bytes of "GENESIS" for the first record ever written to a partition.
//   - `hash` is SHA-256 over `(prev_hash || record_body_bytes)`, where `record_body_bytes`
//     is the canonical (deterministic prost, `.btree_map(["."])`) encoding of this record
//     with `prev_hash` and `hash` themselves cleared to their zero value first. See
//     `crates/av-command/src/ledger.rs`'s module doc for the exact on-disk framing and the
//     byte-level procedure this description summarizes.
message LedgerRecord {
  // Position of this record within its partition's chain, 1-based, strictly increasing.
  uint64 seq = 1;
  // The entity id this record's Command belongs to -- the partition key.
  string partition = 2;
  bytes prev_hash = 3;
  bytes hash = 4;
  // When this record was appended, nanoseconds on TAI, always from the injected Clock
  // (`crates/av-command/src/clock.rs`) -- never the wall clock read directly.
  int64 tai_ns = 5;
  // The `Command.id` this record is about.
  string command_id = 6;
  // The transition being recorded.
  CommandTransition transition = 7;
  // Present for the transition produced by policy evaluation at CHECKED (A1.2): set on
  // `COMMAND_STATE_CHECKED` when the policy allowed and on `COMMAND_STATE_REJECTED` when it
  // denied -- a denial must be as reproducible from the ledger as an approval
  // (`crates/av-command/src/authority.rs`'s module doc). Absent (unset) for every other
  // transition state, including a `COMMAND_STATE_REJECTED` transition that did not come from
  // a policy decision (e.g. a structural rejection straight from `PROPOSED`, `state.rs`'s
  // `reject` edge called for a reason other than a policy denial).
  PolicyDecision decision = 8;
  // `Command.command_class` this record's `Command` carried at the time of this transition
  // (A1.2, additive) -- carried on every record, not only the CHECKED/REJECTED ones, so
  // `crates/av-command/src/rate.rs`'s ledger-backed rate source can count "a command entered
  // the machine" (a `COMMAND_STATE_PROPOSED` record) grouped by class without needing a
  // second index or a join against some other store.
  string command_class = 9;
  // `Command.idempotency_key` this record's `Command` carried at the time of this transition
  // (A1.3, additive), empty when the command declared none. Carried on every record, not
  // only `COMMAND_STATE_DISPATCHED` ones, for the same reason `command_class` is carried on
  // every record above: `crates/av-command/src/ledger.rs`'s `scan_dispatched_idempotency_
  // keys` reads this straight off `COMMAND_STATE_DISPATCHED` records without needing a
  // second index or a join against some other store, and a caller inspecting any record
  // never has to ask "which Command's key was this" separately. This is what
  // `CommandAuthorityServiceImpl` (`crates/av-command/src/service.rs`) rebuilds its
  // in-process duplicate-dispatch guard from at construction, so that guarantee survives a
  // process restart -- `command.proto`'s own doc comment on `Command.idempotency_key` ("the
  // edge never dispatches the same key twice") is unconditional, not "only within one
  // process lifetime", and this field is what makes that true from the durable ledger, not
  // from RAM alone.
  string idempotency_key = 10;
  // The full `Command` exactly as it stood at the time of this transition -- its `state` and
  // its `transitions` list both included, `transitions` carrying this record's own
  // `transition` as its last element (never a disagreement between the two: this is the same
  // `Command` value the caller that appended this record already produced by driving the
  // state machine, cloned onto the record, not a second copy assembled from other fields).
  // Additive (A1.3-round-2, question 203(a)): the lead's ratified decision on the manager's
  // own open item ("`Query` does not survive a restart") is "fixed next round by carrying the
  // full `Command` on `LedgerRecord` ..., not by re-deriving it" -- this field is that fix.
  // Before this field existed, a `LedgerRecord` had no `payload`, `deadline_tai_ns`,
  // `not_before_tai_ns`, `label` or `provenance`, so `CommandAuthorityServiceImpl`'s
  // in-memory `commands` index (`crates/av-command/src/service.rs`) could not be rebuilt from
  // the ledger at construction and a process restart lost every command it had not itself
  // proposed. `crates/av-command/src/ledger.rs`'s `Ledger::scan_commands` now reads this field
  // straight off each partition's records (keeping the last one written per `command_id`,
  // since a later transition's `Command` snapshot supersedes an earlier one) to rebuild that
  // index before the first RPC is served -- the same construction-time discipline
  // `scan_dispatched_idempotency_keys` already established for the idempotency guard.
  //
  // Does **not** make `command_class` (field 9) or `idempotency_key` (field 10) redundant,
  // even though both values are also reachable as `command.command_class`/`command.
  // idempotency_key` inside this field: those two flat fields stay so `count_proposed_by_
  // class_in_window` and `scan_dispatched_idempotency_keys` keep reading one scalar field
  // straight off the wire, on every record, without decoding a nested `Command` message just
  // to answer "which class" or "which key" -- a cheap, direct read that predates this field
  // and that this field does not need to replace to do its own, different job (reconstructing
  // a whole `Command`, not scanning a single scalar across every record in a partition).
  Command command = 11;
  // R3.5a (`docs/aiplane-plan.md` milestone A5; `docs/open-questions.md` question 201(d)):
  // the `CommandProposal` (`command.proto`) a model or agent submitted at `Propose` --
  // `rationale` and `evidence_ids` included. Self-evidence about THIS record, exactly like
  // `command` (field 11) above, and enforced the identical way at the identical site
  // (`crates/av-command/src/ledger.rs`'s `Ledger::append`, following that field's own
  // enforced-not-merely-documented precedent): set **only** on the `PROPOSED` record (never
  // re-attached on a later transition of the same command), and its own `command.id` must
  // agree with this record's own `command_id` -- a caller that gets either wrong is refused
  // there, not trusted. Before this field existed, `CommandAuthorityServiceImpl::propose`
  // used only `CommandProposal.command`; `rationale`/`evidence_ids` were accepted on the wire
  // and never persisted anywhere, so "proposals with their rationale and evidence" (A5) could
  // not be served at all -- `crates/av-command/src/ledger.rs`'s `Ledger::scan_proposals` now
  // reads this field straight off each partition's `PROPOSED` records to answer `Query`'s new
  // `proposals` map below, surviving a restart exactly like `command` (field 11) does.
  CommandProposal proposal = 12;
}

// A verified principal, from an OIDC access token's claims (A2.1, `docs/aiplane-plan.md`
// milestone A2; question 34's secsso claims contract; question 201(b)). Filled **only** by a
// successful `crates/av-command/src/oidc.rs` verification -- there is no code path anywhere
// in this crate that constructs a `Principal` from a token it has not verified the signature,
// issuer, audience, expiry (`exp`) and not-before (`nbf`) of, against a real issuer key and
// the injected `Clock`. `CommandAuthorityService.Authorize` records `sub` as the verified
// `CommandTransition.principal` (`command.proto`); `groups`/`amr`/`acr` are now read by A2.2's
// role/MFA gate (`crates/av-command/src/authz.rs`) for exactly that decision.
//
// TAI conversion (ADR-001 "Time"): a JWT's `exp`/`iat` claims are Unix (UTC) seconds, per
// RFC 7519's `NumericDate`. The one conversion site is `crates/av-command/src/oidc.rs`'s
// `unix_seconds_to_tai_ns`, which multiplies by 1_000_000_000 and calls
// `av_cdm::time::Tai::from_utc_nanos` -- the identical UTC->TAI boundary conversion
// `crates/av-command/src/clock.rs`'s `SystemClock` itself uses for the wall clock. There is
// no second, ad hoc UTC/TAI conversion anywhere in this crate.
//
// No human-vs-service field: the secsso claims contract this message follows (`sub`,
// `groups`, `amr`, `acr`, issuer, audience, `jti`, issued-at/expiry) carries no claim that
// itself declares a subject human or machine. An empty `amr` is a *heuristic* at best (a
// service-subject token minted by a client-credentials grant typically has no `amr` because
// no user authentication method ran) -- it is not a declared claim, and a human token issued
// without an MFA step would also have an empty `amr`. Rather than invent a field the claims
// contract does not support, this message adds none; A2.2 (which owns the roles/MFA gate) is
// free to add one additively if a later claims contract does declare a kind, e.g. a `azp`
// client-id convention or an explicit `account_type` claim.
message Principal {
  // The verified `sub` claim. Never empty -- `crates/av-command/src/oidc.rs`'s `verify`
  // refuses a token with a missing or empty `sub` before this message is ever constructed.
  string sub = 1;
  // The `groups` claim (secsso: roles, A2.2's role gate), in the exact order the token's own
  // JSON array carried them -- `crates/av-command/src/oidc.rs`'s module doc explains why
  // claim order, not a sorted order, is this crate's deterministic choice for this field.
  repeated string groups = 2;
  // The `amr` claim (secsso: authentication methods, A2.2's MFA gate), in claim order, same
  // reasoning as `groups`. Empty when the token carried no `amr` claim at all.
  repeated string amr = 3;
  // The `acr` claim (secsso: authentication context class). Empty when absent.
  string acr = 4;
  // The token's own `iss` claim, already verified equal to the configured issuer.
  string issuer = 5;
  // The configured audience this principal was verified against (not the full `aud` claim,
  // which may list more than one audience) -- see `crates/av-command/src/oidc.rs`'s `verify`
  // for why this field carries the configured value rather than the token's raw `aud`.
  string audience = 6;
  // The token's own `jti` claim. Empty when the token carried none (unlike `sub`, `jti` is
  // never a refusal reason by itself in A2.1).
  string jti = 7;
  // The token's own `iat` claim, converted to TAI nanoseconds (see this message's doc).
  int64 issued_at_tai_ns = 8;
  // The token's own `exp` claim, converted to TAI nanoseconds (see this message's doc) --
  // already verified to be strictly after the clock reading `verify` was given.
  int64 expiry_tai_ns = 9;
}

// A role's granted command classes (A2.2, `docs/aiplane-plan.md` milestone A2's second half;
// `crates/av-command/src/authz.rs`). The role table a profile declares is a list of these,
// read from `Principal.groups` -- a principal may authorize command class C only if at least
// one of its groups is a role in the table that grants C, directly or through the wildcard.
// **Deny by default**, at two levels this message's own shape makes explicit rather than
// leaving to a caller's convention: a role name absent from the table grants nothing (there
// is no `RoleBinding` for it to consult at all), and a `RoleBinding` present in the table but
// whose `command_classes` does not list C (and does not list the wildcard either) also grants
// nothing -- there is no third state where "role known, class unlisted" means "allow".
message RoleBinding {
  // The role name, matched against one entry of `Principal.groups`.
  string role = 1;
  // Command classes this role may authorize. The literal string `"*"` grants every class --
  // chosen over, say, an empty list meaning "every class" so that "this role grants nothing"
  // (an empty list) and "this role grants everything" (`["*"]`) are two different, equally
  // explicit list contents, never one list shape silently meaning the other depending on
  // whether it happens to be empty.
  repeated string command_classes = 2;
}

// A time-limited grant to `subject` (matched against `Principal.sub`) to authorize
// `command_classes` against `entity_ids`, on top of whatever its own role grants -- A2.2,
// `crates/av-command/src/authz.rs`. `command_classes`/`entity_ids` use the identical `"*"`
// wildcard convention `RoleBinding.command_classes` does, for the same reason.
//
// **Expiry boundary convention -- the same one A2.1's token `exp` uses, not a second one**:
// a delegation is valid only while `not_before_tai_ns <= now_tai_ns < expires_tai_ns` --
// `now_tai_ns == expires_tai_ns` is already expired (refused), `now_tai_ns == expires_tai_ns -
// 1` (one nanosecond earlier) is not. This mirrors `crates/av-command/src/oidc.rs::TokenError::
// Expired`'s own boundary (`now_tai_ns >= exp_tai_ns` is expired) exactly, so this crate has
// one expiry-boundary rule across both its token and its delegation paths, not two that could
// silently drift apart. The mirror image holds for `not_before_tai_ns`, matching `oidc.rs`'s
// `nbf` handling: `now_tai_ns == not_before_tai_ns` is already valid; one nanosecond earlier
// is not yet valid.
message Delegation {
  // Opaque id, matched against `AuthorizeRequest.delegation_id` /
  // `CommandTransition.delegation_id` (`command.proto`).
  string id = 1;
  // The subject this delegation is granted to -- must equal the authorizing principal's own
  // verified `Principal.sub` (A2.1) for this delegation to apply to that principal's request.
  string subject = 2;
  // Command classes this delegation covers. `"*"` grants every class -- see `RoleBinding.
  // command_classes`'s doc for why an empty list and `["*"]` are kept as two distinct,
  // explicit contents rather than one shape meaning the other.
  repeated string command_classes = 3;
  // Entities (`Command.entity_id`) this delegation covers. Same `"*"` convention.
  repeated string entity_ids = 4;
  // Nanoseconds on TAI. See this message's doc for the exact boundary.
  int64 not_before_tai_ns = 5;
  // Nanoseconds on TAI. See this message's doc for the exact boundary.
  int64 expires_tai_ns = 6;
  // Who granted this delegation, free text (e.g. an operator's own `sub`) -- not itself
  // verified by this crate; the grant is only as trustworthy as wherever the delegations file
  // this came from is reviewed and stored (`crates/av-command/src/authz.rs`'s module doc).
  string granted_by = 7;
  // Why, free text, e.g. "temporary burn authority for contingency ops".
  string reason = 8;
}

// ---------------------------------------------------------------------------------------
// A1.3: CommandAuthorityService -- propose, check, authorize, dispatch, ack, query, ledger
// verify, over the same OpenSSL-backed tonic stack `av-grpc`/`av-dynamics-service` use
// (`crates/av-command/build.rs`, `crates/av-command/src/service.rs`). Plaintext on loopback
// only (question 155); mTLS across a host boundary is the service-owned nginx front's job
// (question 84), not this service's own transport.
// ---------------------------------------------------------------------------------------

// `Propose` request: the only message a model or agent may emit toward the command path
// (`command.proto`'s own `CommandProposal` doc comment), plus the principal proposing it --
// `CommandProposal` itself carries no principal field, so this request carries the one
// `state::propose` needs to record on the resulting `PROPOSED` transition.
message ProposeRequest {
  CommandProposal proposal = 1;
  // The model/agent identity proposing this command, e.g. "model-x". Recorded verbatim as
  // the `PROPOSED` transition's `CommandTransition.principal` -- not verified against
  // anything (A2's OIDC principal work does not reach `Propose`; a proposer is not a human
  // operator).
  string principal = 2;
}

// `Check` request: identifies an already-`PROPOSED` command (held in this service's
// in-memory index, keyed by `Command.id`) to evaluate policy over. Carries no policy input
// of its own -- the service reconstructs `PolicyInput` from the stored `Command` plus real
// ledger rate history, exactly like `crates/av-command/src/authority.rs`'s `check_command`.
//
// Question 209(a): `Propose` now runs this exact check automatically, as a separate logged
// transition, the instant its own `PROPOSED` record lands -- a command this service is
// holding therefore normally reaches `CHECKED`/`REJECTED` before `Propose` even returns.
// This RPC stays callable as the retry path for the one case that still leaves a command
// `PROPOSED`: `Propose`'s automatic check failing with I/O (never a policy denial, which is
// itself a typed `PERMISSION_DENIED` refusal on `Propose`, not a `PROPOSED` command left
// behind). Calling `Check` against anything already past `PROPOSED` is refused
// `FAILED_PRECONDITION`, naming the command's actual current state.
message CheckRequest {
  string command_id = 1;
}

// `Authorize` request. See this file's header comment and `AuthorizeRequest.
// principal_token`'s own doc comment above for what A2.1 does and does not do with these
// two fields.
message AuthorizeRequest {
  string command_id = 1;
  // A compact-serialization JWS bearer token (an OIDC access token). A2.1
  // (`crates/av-command/src/oidc.rs`, wired in `crates/av-command/src/service.rs`) verifies
  // this for real: signature (against the configured issuer's public key), `alg` allow-list,
  // `iss`, `aud`, `exp`/`nbf` against the injected clock, and a non-empty `sub` -- an
  // unverifiable token is refused `UNAUTHENTICATED` before any state transition is attempted.
  // On success, the verified `Principal.sub` (`authority.proto`) is recorded as
  // `CommandTransition.principal`. A2.1 verifies *who* the caller is; A2.2
  // (`crates/av-command/src/authz.rs`) then decides *whether* that caller may authorize this
  // command class: a role-gated check against `Principal.groups`, an MFA check against
  // `Principal.amr`/`acr` for a hazardous command class, and -- when `delegation_id` below is
  // non-empty -- a `Delegation` lookup instead of the role check (see that field's own doc).
  string principal_token = 2;
  // The delegation the principal claims to be acting under, if any. Empty means "authorize
  // under the principal's own role, not a delegation" -- `crate::authz` then checks
  // `Principal.groups` against the profile's role table. Non-empty means "authorize under
  // this `Delegation.id` instead of any role" -- `crate::authz` looks it up, checks `subject`
  // matches the verified `Principal.sub`, `command_classes`/`entity_ids` cover this command,
  // and the injected clock falls inside `[not_before_tai_ns, expires_tai_ns)`; a delegation
  // that fails any of those is its own typed refusal, never silently falls back to the role
  // check. Recorded on `CommandTransition.delegation_id` exactly as A1.3 carried it, now
  // evaluated rather than passed through unchecked.
  string delegation_id = 3;
}

// `Dispatch` request: identifies an `AUTHORIZED` command to hand to the `DispatchSink`
// (`crates/av-command/src/service.rs`; A3 supplies the real kernel binding behind it).
//
// R3.1 (`docs/aiplane-plan.md` round 2's declared gap; `docs/open-questions.md` question
// 206): `service_token` is now REQUIRED and verified through the identical code path a human
// `AuthorizeRequest.principal_token` takes (`crates/av-command/src/oidc.rs::verify`, the same
// `IssuerConfig`, RS256 only, the same clock-boundary expiry) -- see that field's own doc
// comment below. The dispatching principal is no longer a fixed, unauthenticated string
// (`"ground-segment"`, this comment's own previous text); it is the **verified service
// subject** the token names, gated additionally by `crates/av-command/src/authz.rs::
// ServiceRoleTable` (a profile-declared `authority.service_roles` block, disjoint from the
// human `authority.roles` table by construction) requiring a granting role that lists
// `"dispatch"`.
message DispatchRequest {
  string command_id = 1;
  // R3.1: a compact-serialization JWS (an OIDC access token for a **service** subject),
  // verified through the exact same `crates/av-command/src/oidc.rs::verify` path
  // `AuthorizeRequest.principal_token` uses -- same `IssuerConfig`, same RS256-only rule, same
  // boundary-nanosecond expiry against the injected clock. There is no second verifier and no
  // relaxed check for this field. On success, the verified `Principal.sub` is recorded as
  // `CommandTransition.principal` (never a fixed string); the verified `Principal.groups` is
  // then checked against the profile's `authority.service_roles` table for a role granting
  // this RPC (`"dispatch"`) -- deny by default: an unverified token, or a verified token
  // naming no granting service role (this includes every purely-human token, since
  // `service_roles` and `roles` are disjoint by construction), is refused before any state
  // transition is attempted or any ledger record is appended, exactly like `Authorize`'s own
  // `principal_token` refusal path. An empty `service_token` is refused the same way a
  // malformed one is (`crates/av-command/src/oidc.rs::TokenError::WrongSegmentCount`) -- there
  // is no "no token supplied" default that means "allow".
  string service_token = 2;
}

// `Ack` request: reports how far the dispatched command got, per `AckLevel` (`command.proto`)
// -- "the ack level is a request field" (this task's own brief).
//
// R3.1: `service_token` is now REQUIRED, verified identically to `DispatchRequest.
// service_token` above, gated on a service role granting `"ack"`. `principal`/`reason` predate
// R3.1 and are unchanged in their own field numbers, but `principal`'s MEANING is now precisely
// this (see `ExpireRequest.principal`'s doc comment below for the identical rule stated once,
// and `FailRequest.principal` for the third copy): it is a caller-DECLARED label, never trusted
// as identity and never itself recorded as `CommandTransition.principal` -- the verified
// `service_token` subject is authoritative for that field. When `principal` is non-empty and
// disagrees with the verified subject, the request is refused (`crates/av-command/src/
// service.rs::ServiceError::PrincipalMismatch`, `INVALID_ARGUMENT`) rather than one of the two
// being silently preferred over the other -- an ack report whose declared reporter and whose
// verified caller disagree is exactly the kind of discrepancy ADR-004's "everything rejected is
// counted" exists to surface, not paper over. An empty `principal` is never a disagreement (it
// declares nothing) and is accepted; when present and equal to the verified subject, it is
// carried into `CommandTransition.reason` as the caller's own declared label, alongside which
// service role granted this call.
message AckRequest {
  string command_id = 1;
  AckLevel ack_level = 2;
  string principal = 3;
  string reason = 4;
  // R3.1: see `DispatchRequest.service_token`'s doc comment for the full verification
  // contract; identical here, gated on a service role granting `"ack"`.
  string service_token = 5;
}

// `Expire` request (A3.2, D2): moves a `DISPATCHED` (or `AUTHORIZED`) command to `EXPIRED`,
// e.g. when `crates/av-kernel`'s own `ExternalCommandSource`/`CommandOutcome::Expired`
// reports that this command's `deadline_tai_ns` passed before it ever reached the wire, or
// when it never even reached that far (see `state::expire`'s own doc comment for both legal
// source states). `reason` is caller-supplied free text -- the kernel-side binding names the
// deadline and the kernel epoch it evaluated the expiry at, so the ledger's own reason text
// carries the same detail the kernel's own typed `CommandOutcome::Expired` did, not merely
// "expired".
//
// R3.1 (`docs/aiplane-plan.md` round 2's declared gap, closed this round): `service_token` is
// now REQUIRED (see `DispatchRequest.service_token`'s doc comment for the full verification
// contract; gated here on a service role granting `"expire"`), and `principal` is now ADDITIVE
// -- matching `AckRequest.principal`'s existing semantics exactly, not a second, divergent
// convention: a caller-DECLARED label, never itself trusted as identity and never what lands on
// `CommandTransition.principal` (the verified `service_token` subject is authoritative for
// that field, always). When non-empty, `principal` must agree with the verified subject or the
// request is refused `INVALID_ARGUMENT` (`ServiceError::PrincipalMismatch`) -- a typed refusal,
// never a silent preference of one value over the other (round 2 left this asymmetric with
// `Ack`, which already carried a `principal` field while `Expire`/`Fail` carried none at all;
// this round closes exactly that gap, symmetrically, on both `Expire` and `Fail`). An empty
// `principal` declares nothing and is always accepted; a non-empty, agreeing one is carried
// into `CommandTransition.reason` as the caller's own declared label.
message ExpireRequest {
  string command_id = 1;
  string reason = 2;
  // R3.1: a caller-declared label naming who/what observed this expiry (e.g. the kernel
  // binding's own identity string) -- see this message's own doc comment above for the full
  // disagreement rule. Never trusted as identity on its own.
  string principal = 3;
  // R3.1: see `DispatchRequest.service_token`'s doc comment for the full verification
  // contract; identical here, gated on a service role granting `"expire"`.
  string service_token = 4;
}

// `Fail` request (A3.2, D2): moves a `DISPATCHED` command to `FAILED`. Exists so every kernel
// refusal the command already survived `Dispatch` for (`CommandOutcome::
// DuplicateIdempotencyKey`, `CommandOutcome::Refused`, `CommandOutcome::
// NotDispatchedRunEnded` -- `crates/av-kernel/src/drm/command_source.rs`) still lands on the
// ledger, rather than leaving a `DISPATCHED` command with no further record of what actually
// happened to it once the kernel decided against it (`docs/aiplane-plan.md`'s own "a failure
// that leaves no trace" is exactly the defect shape round 1 found six times). `reason` is
// caller-supplied free text naming the kernel's own typed refusal.
//
// R3.1: `service_token`/`principal` are additive exactly as `ExpireRequest`'s own doc comment
// above describes -- the identical contract, gated here on a service role granting `"fail"`.
// See that message's doc comment for the full disagreement rule (never repeated a third time
// in full; `AckRequest.principal`'s doc comment is the first copy, `ExpireRequest.principal`'s
// the second, this the third -- one rule, stated once and cross-referenced, not three that
// could drift apart).
message FailRequest {
  string command_id = 1;
  string reason = 2;
  // R3.1: see `ExpireRequest.principal`'s doc comment for the full disagreement rule.
  string principal = 3;
  // R3.1: see `DispatchRequest.service_token`'s doc comment for the full verification
  // contract; identical here, gated on a service role granting `"fail"`.
  string service_token = 4;
}

// The response every one of `Propose`/`Check`/`Authorize`/`Dispatch`/`Ack`/`Expire`/`Fail`
// returns: the `Command` in its new state, plus the `PolicyDecision` that produced it --
// present only for `Check`'s response (the only one of these that runs a policy decision);
// unset for every other one.
message CommandResponse {
  Command command = 1;
  PolicyDecision decision = 2;
}

// `Query` selects either one command by id, or every command for one entity with an optional
// `CommandState` filter (`COMMAND_STATE_UNSPECIFIED` means no filter -- every state).
message QueryByEntity {
  string entity_id = 1;
  CommandState state_filter = 2;
}

message QueryRequest {
  oneof selector {
    string command_id = 1;
    QueryByEntity entity = 2;
  }
}

message QueryResponse {
  // Sorted by `Command.id` (this service's in-memory index is a `BTreeMap`, ADR-004's
  // determinism rule: no `HashMap` iteration on any output path) -- deterministic order,
  // never the order commands happened to be inserted.
  repeated Command commands = 1;
  // R3.5a (`docs/aiplane-plan.md` milestone A5): the original `CommandProposal` (rationale,
  // evidence ids) for every command in `commands` above that has one -- every command does,
  // in this crate's own production paths, since `propose` is the state machine's only entry
  // point (`crate::state`'s module doc) and `Propose` always attaches one
  // (`crates/av-command/src/service.rs::propose`, R3.5a). Keyed by `Command.id`, rebuilt from
  // the ledger by `crates/av-command/src/ledger.rs`'s `Ledger::scan_proposals` -- additive,
  // `map<string, ...>` (proto3 map, generated as a `BTreeMap`, ADR-004's determinism rule,
  // matching every other map in this package). A command absent from this map (only possible
  // for a ledger record a test appended with no `proposal` attached) has no entry, never a
  // zero-valued `CommandProposal`.
  map<string, CommandProposal> proposals = 2;
  // R3.5a: the `PolicyDecision` for every command in `commands` above that has been
  // `CHECKED`/`REJECTED` by policy -- previously only ever returned by `Check`'s own
  // response (`CommandResponse.decision`), so a caller that queries later (a command console
  // that was not itself the one that called `Check`) could never see why a command was
  // checked or rejected. Keyed by `Command.id`, rebuilt from the ledger by
  // `crates/av-command/src/ledger.rs`'s `Ledger::scan_decisions` off `LedgerRecord.decision`
  // (field 8). A command not yet `CHECKED`/`REJECTED` (still `PROPOSED`, or checked
  // structurally-invalid before a policy decision ever ran) has no entry, never a
  // zero-valued `PolicyDecision`.
  map<string, PolicyDecision> decisions = 3;
}

// `VerifyLedger` request: one partition by name, or every partition this service's ledger
// currently has a file for when `partition` is empty.
message VerifyLedgerRequest {
  string partition = 1;
}

message VerifyLedgerResponse {
  // One `ChainVerification` (`envelope.proto`) per partition checked, in the same order
  // `crate::ledger::Ledger::partitions` reports them (sorted by the partition's sanitized
  // filename) when `VerifyLedgerRequest.partition` was empty; a single-element list
  // otherwise.
  repeated ChainVerification results = 1;
  // The logical AND of every result's own `ok` -- `true` only when every checked partition's
  // chain is intact.
  bool ok = 2;
}

// The command authority service: propose, check, authorize, dispatch, ack, expire, fail,
// query, and ledger verify, over the state machine and ledger `crates/av-command`'s library
// modules already implement (`crates/av-command/src/service.rs`). See each RPC's own request
// message doc comment above for what it does and does not verify; see that module's own doc
// comment for the `tonic::Status` code chosen for every refusal. `Expire`/`Fail` are A3.2
// additions (D2) -- additive only, no existing rpc or field number above moves.
service CommandAuthorityService {
  rpc Propose(ProposeRequest) returns (CommandResponse);
  rpc Check(CheckRequest) returns (CommandResponse);
  rpc Authorize(AuthorizeRequest) returns (CommandResponse);
  rpc Dispatch(DispatchRequest) returns (CommandResponse);
  rpc Ack(AckRequest) returns (CommandResponse);
  rpc Expire(ExpireRequest) returns (CommandResponse);
  rpc Fail(FailRequest) returns (CommandResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc VerifyLedger(VerifyLedgerRequest) returns (VerifyLedgerResponse);
}

// ---------------------------------------------------------------------------------------
// A4a: crates/av-gateway -- the read-only, label-aware gateway over run products
// (docs/aiplane-plan.md milestone A4; ADR-004's "AI plane" section: "The platform's
// read-only data access is an MCP server on secrouter's deny-by-default tool allow-list").
// Additive only -- nothing above this line is touched. `RunIdentity`/`GatewayQueryRequest`/
// `GatewayQueryResponse`/`DataGatewayService` are this gateway's own read surface;
// `ProposalEvidence` is the "evidence topic" (D6) realized as a ledger record.
// ---------------------------------------------------------------------------------------

// D1: a caller names a run by IDENTITY, never a path. `run_id` is the gateway's catalogue
// primary key (RunProducts.run_id, unique per catalogue entry -- crates/av-gateway/src/
// catalogue.rs). `config_hash`, the plan's "run hash" (there is no field literally named
// `run_hash` anywhere in this workspace; `Provenance.config_hash`, core.proto, is the
// closest fit and is what this field means), is an OPTIONAL cross-check: when non-empty, it
// must equal the catalogue entry's own `RunProducts.provenance.config_hash` exactly, or the
// query is refused (RefusalReason::ConfigHashMismatch, typed and counted) -- it is never
// itself a lookup key, so a caller cannot resolve a run by guessing a hash without also
// naming its real run_id. `run_id` alone (config_hash empty) is a complete, valid identity.
message RunIdentity {
  string run_id = 1;
  string config_hash = 2;
}

// Which part of a run's products a GatewayQueryRequest asks for. Unspecified is always a
// malformed request (crate::gateway::RefusalReason::MalformedRequest), never treated as a
// default selector.
enum GatewaySelector {
  GATEWAY_SELECTOR_UNSPECIFIED = 0;
  GATEWAY_SELECTOR_ALL = 1;
  GATEWAY_SELECTOR_TRAJECTORIES = 2;
  GATEWAY_SELECTOR_EVENTS = 3;
  GATEWAY_SELECTOR_SCORES = 4;
  GATEWAY_SELECTOR_MEASUREMENTS = 5;
}

// `DataGatewayService.Query` request.
message GatewayQueryRequest {
  RunIdentity run = 1;
  // The marking the calling principal is cleared to, checked (D2) against this gateway
  // deployment's own configured, ordered clearance ladder (crates/av-gateway/src/labels.rs,
  // copied from crates/av-edge/src/policy.rs's ladder convention verbatim -- rank = index,
  // never a hardcoded enum or a numeric level).
  string caller_clearance = 2;
  GatewaySelector selector = 3;
  // Set ONLY by a crafted/adversarial request attempting D1's caller-supplied-path attack
  // (mirrors altavista/server.py's POST /api/cdm/sweep/sample and its own
  // test_caller_supplied_products_uri_is_never_trusted): this field is NEVER read for
  // resolution -- a caller names a run through `run` (RunIdentity) alone. A non-empty value
  // here is refused outright (RefusalReason::CallerSuppliedPath) and counted, before any
  // other validation of this request runs.
  string caller_supplied_products_uri = 4;
  // R5.1 (`docs/open-questions.md` question 208(b)): a compact-serialization JWS (an OIDC
  // access token), verified through the exact same `crates/av-command/src/oidc.rs::verify`
  // path `AuthorizeRequest.principal_token` uses -- same `IssuerConfig`, same RS256-only
  // rule, same boundary-nanosecond expiry against the injected clock. There is no second
  // verifier and no relaxed check for this field. On success, the verified `Principal.
  // groups` is checked against this deployment's own configured role table for a role
  // granting the `"query"` surface (`crates/av-gateway/src/auth.rs::Surface::Query`) --
  // deny by default, exactly `RoleTable::granting_role`'s own reasoning: an unverified
  // token, or a verified token naming no granting role, is refused before any product data
  // is ever touched. The verified `Principal.groups` is ALSO mapped, through a second
  // deployment-configured table, to the caller's effective clearance marking -- `caller_
  // clearance` above is never itself trusted as identity or as clearance: when it is
  // non-empty it must agree with the token-derived clearance or the request is refused
  // (never silently preferring the higher or the lower of the two); when empty, the
  // token-derived clearance is used. An empty `caller_token` is refused the same way a
  // malformed one is -- there is no "no token supplied" default that means "allow".
  string caller_token = 5;
}

message GatewayQueryResponse {
  RunIdentity run = 1;
  // The label this gateway's own catalogue has on file for this run (D2). Not read off
  // RunProducts itself -- run.proto's RunProducts carries no Label of its own (Trajectory/
  // Event do; ScoreResult/Measurement do not), so the catalogue entry's own configured
  // Label is the one label-enforcement point common to every selector -- see
  // crate::catalogue's module doc.
  Label product_label = 2;
  // Populated only for GATEWAY_SELECTOR_ALL or GATEWAY_SELECTOR_TRAJECTORIES.
  map<string, Trajectory> trajectories = 3;
  // Populated only for GATEWAY_SELECTOR_ALL or GATEWAY_SELECTOR_EVENTS, sorted (tai_ns, id)
  // exactly as RunProducts.events already is.
  repeated Event events = 4;
  // Populated only for GATEWAY_SELECTOR_ALL or GATEWAY_SELECTOR_SCORES.
  map<string, ScoreResult> scores = 5;
  // Populated only for GATEWAY_SELECTOR_ALL or GATEWAY_SELECTOR_MEASUREMENTS, sorted
  // (epoch_ns, measurement_id) exactly as RunProducts.measurements already is.
  repeated Measurement measurements = 6;
  // D5: deterministic, derived from this query's own canonical content
  // (crate::query_id::compute_query_id, mirroring crates/av-command/src/policy.rs's
  // compute_decision_id convention byte for byte) -- never a random id, never a counter
  // that depends on wall-clock arrival order, so a replay resolves it exactly. Recorded in
  // ProposalEvidence.query_ids (below) so a replay can find exactly which queries a
  // proposal's rationale is grounded in.
  string query_id = 7;
}

// The read-only, label-aware gateway over run products (A4a). Every rpc here is
// deny-by-default read access: nothing in this service can create, modify or delete a
// Command or a ledger record. crate::propose_only::ProposeOnlyAuthority (D4) is the one,
// structurally separate seam that reaches the command authority (over
// CommandAuthorityService, not this service), and it is not part of this service or its
// generated client/server.
service DataGatewayService {
  rpc Query(GatewayQueryRequest) returns (GatewayQueryResponse);
}

// D6: "an evidence topic" realized as a ledger partition, not a broker (ADR-004: "for the
// engine and command services the durable log itself is the ledger, chained per
// partition"; question 200(d)'s identical call for the edge track's own durable log). No
// Kafka/Redpanda crate exists in this tree or is added by this message; a future round MAY
// replace the ledger-partition realization with a real broker without changing this
// message's own shape (question 200(d)'s "the consumer trait is spoore-io's so the broker
// can replace the files" reasoning, mirrored here). crates/av-gateway/src/evidence.rs
// documents the exact partition-naming convention and how this message is packed into an
// existing, unmodified crates/av-command/src/ledger.rs `Ledger::append` call (via
// `Command.payload`, a `google.protobuf.Any`) rather than by adding a field to
// `LedgerRecord` (which would break that crate's own exhaustive struct literal).
message ProposalEvidence {
  // The Command.id of the PROPOSED command this evidence record is about.
  string command_id = 1;
  // The run identity the model read before proposing (D5: "what the model saw: the run
  // identity it read").
  RunIdentity run = 2;
  // Every GatewayQueryResponse.query_id the model's session issued before this proposal,
  // in the order the gateway served them (D5: "the ids of the queries it issued").
  repeated string query_ids = 3;
  // The model identity and version (D5's attribution requirement) -- reuses core.proto's
  // Provenance.tool convention ("Tool or service (and version) that produced the
  // artifact") rather than inventing a second identity shape.
  string model_identity = 4;
  string model_version = 5;
  // When this evidence record was written, nanoseconds on TAI, always from the injected
  // Clock (av_command::clock::Clock) -- never the wall clock read directly (ADR-004, D8).
  int64 recorded_tai_ns = 6;
}

// ---------------------------------------------------------------------------------------
// A4b: crates/av-proposer -- the network propose path a containerised model sidecar needs.
// Additive only. See this file's header comment's "A4b" entry for why this is a second
// service rather than a new rpc on DataGatewayService or a second MCP transport.
// ---------------------------------------------------------------------------------------

// `ModelProposeService.ProposeCommand` request: carries exactly what `crates/av-gateway/src/
// mcp.rs::handle_propose_command`'s own JSON schema already accepts, as typed fields instead
// of a JSON object -- the two surfaces share one implementation
// (`crates/av-gateway/src/propose_flow.rs`), so this message's fields are that shared
// function's own input, named identically to the MCP tool's `arguments` keys.
message ProposeCommandRequest {
  // `Command.id`. Never state/transitions: like the MCP tool's own JSON schema, there is no
  // field anywhere on this message that could construct an already-started `Command` --
  // `AlreadyStarted` is reachable only against a hand-crafted request built by bypassing this
  // message's own field set (i.e. by a test constructing the underlying `CommandProposal`
  // directly against `crate::propose_only::ProposeOnlyAuthority`, never through this rpc's own
  // wire schema).
  string command_id = 1;
  string entity_id = 2;
  string command_class = 3;
  bool hazardous = 4;
  // Empty until an envelope policy exists (question 53) -- carried so the real refusal
  // (`state::propose`'s own `EnvelopeNotAllowed`) is reachable end to end through this rpc,
  // exactly as it is through the MCP tool.
  string envelope_id = 5;
  string idempotency_key = 6;
  // Why, in the proposer's own words; cited run ids and query ids as evidence
  // (`CommandProposal.rationale`).
  string rationale = 7;
  repeated string evidence_ids = 8;
  // The model/agent identity proposing this command (`ProposeRequest.principal`) -- also
  // recorded verbatim as `ProposalEvidence.model_identity` below.
  string principal = 9;
  // Recorded verbatim as `ProposalEvidence.model_version` below.
  string model_version = 10;
  // The run identity the model read before proposing -- `ProposalEvidence.run` (D5: "what
  // the model saw").
  RunIdentity run = 11;
  // Every `GatewayQueryResponse.query_id` the model's session issued before this proposal, in
  // the order the gateway served them -- `ProposalEvidence.query_ids`.
  repeated string query_ids = 12;
  // R5.1 (`docs/open-questions.md` question 208(b)): a compact-serialization JWS (an OIDC
  // access token for a **service** subject -- the proposer), verified through the exact same
  // `crates/av-command/src/oidc.rs::verify` path `DispatchRequest.service_token` uses --
  // same `IssuerConfig`, same RS256-only rule, same boundary-nanosecond expiry against the
  // injected clock. On success, the verified `Principal.groups` is checked against this
  // deployment's own configured SERVICE role table for a role granting the `"propose"`
  // surface (`crates/av-gateway/src/auth.rs::Surface::Propose`) -- deny by default: an
  // unverified token, or a verified token naming no granting service role (this includes
  // every purely-human token, since the human and service role tables are disjoint by
  // construction -- see `crates/av-gateway/src/auth.rs`'s own module doc), is refused before
  // any command is proposed. `principal` above is never itself trusted as identity: the
  // verified `Principal.sub` is what is recorded, always, as `ProposalEvidence.model_
  // identity`; when `principal` is non-empty it must agree with the verified subject or the
  // request is refused (mirrors `AckRequest.principal`'s own disagreement rule verbatim --
  // see that field's doc comment for the full contract). An empty `caller_token` is refused
  // the same way a malformed one is -- there is no "no token supplied" default that means
  // "allow".
  string caller_token = 13;
}

// `ModelProposeService.ProposeCommand` response: the resulting `Command`, exactly at
// `COMMAND_STATE_PROPOSED` with exactly one transition -- the same value
// `crate::propose_only::ProposeOnlyAuthority::propose` returned to the shared implementation,
// never a second, independently-assembled value.
message ProposeCommandResponse {
  Command command = 1;
}

// The network propose path (A4b). Exactly one rpc, deliberately: this service exists only so
// a proposer with no stdio channel to the gateway (a separate container, question 154's
// "no listening socket" guarantee therefore not available to it the way the MCP transport
// gives it for free) still has a path to `PROPOSED` and nothing else -- the identical
// structural guarantee `crate::propose_only::ProposeOnlyAuthority` gives the MCP tool
// (`crates/av-gateway/src/propose_flow.rs`'s module doc). Never add a second rpc here without
// also asking whether `DataGatewayService`'s "nothing here can create a Command" sentence
// still holds -- it is a property of that OTHER service specifically, not of this file.
service ModelProposeService {
  rpc ProposeCommand(ProposeCommandRequest) returns (ProposeCommandResponse);
}
