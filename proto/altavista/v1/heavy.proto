syntax = "proto3";

// The heavy track's own proto file (`docs/heavy-plan.md`; question 216(f): "`heavy.proto` is
// the track's; everything else additive under `buf breaking` and `buf lint`"). Unlike every
// other file under `proto/altavista/v1/`, THIS file has no legacy wire compatibility to
// protect yet -- nothing in it has shipped anywhere before this track existed -- so within
// this file (and only this file) a message MAY be renamed or a field renumbered if a later
// milestone in this same track needs to; `buf breaking proto --against
// /Users/probe/code/AltaVista/proto` is still run every round regardless, so any such change
// is still a deliberate, visible decision, never an accident. Once a round of THIS file ships
// (i.e. the manager commits it), everything in it already committed becomes additive-only
// exactly like every other file, by the same standing rule (`common.md` rule 10) -- "no legacy
// wire compatibility to protect" describes this file's starting position, not a standing
// exemption from the rule once something is on the wire.
//
// Scope of what this file defines, by milestone -- so the next worker does not invent a
// second shape for something already planned here:
//   - H2c (this task, as committed by this round): `CatalogQuery`, `CatalogRecord`, `GeoBbox`
//     below -- the wire shapes `DataGatewayService.Query`'s new `GATEWAY_SELECTOR_CATALOG`
//     selector (`authority.proto`, additive) carries. `CatalogQuery` is what a caller sends
//     (a bounding box, a time window, a media type, a job id, a result-count limit);
//     `CatalogRecord` is what one matched `crates/av-catalog` asset comes back as, reusing
//     `entity.proto`'s own `AssetRef` for every field that message already carries rather
//     than re-declaring a parallel asset shape (`crates/av-catalog/src/model.rs::
//     CatalogAsset::to_asset_ref` is the identical conversion this selector's own response
//     building reuses, never a second one). `TemporalExtent` is likewise `entity.proto`'s own
//     message, not a second time-range shape -- `crates/av-catalog/src/query.rs::TimeRange`
//     is that crate's own internal, half-open-interval-typed representation of the identical
//     wire concept, converted at the boundary, never duplicated on the wire.
//   - H3a (this task, docs/heavy-plan.md H3 first half): `JobExecutorKind`, `JobFailureKind`,
//     `JobSpec`, `JobFailure`, `JobCompletion`, `JobLogRecord` below -- the durable job queue's
//     own wire shapes (`crates/av-jobs`'s hash-chained log; one `JobLogRecord` per record, a
//     `oneof submitted`/`completed`). `JobSpec.inputs`/`JobCompletion.outputs` reuse
//     `entity.proto`'s own `AssetRef` for every input/output asset reference, never a second,
//     parallel asset shape -- the same reuse discipline H2c's own `CatalogRecord` already
//     established in this file. H3b (the tiler) and H4 (the tile gateway) will add their own
//     message(s) to this file when that work starts -- deliberately NOT speculated here; this
//     round adds only what H3a itself needs.
package altavista.v1;

import "altavista/v1/entity.proto";
import "altavista/v1/envelope.proto";

// A geodetic bounding box, WGS84 degrees, min/max on each axis -- the exact semantics
// `crates/av-catalog/src/query.rs::GeoBbox`'s own module doc states for the bbox-query rule
// this drives (`ST_Intersects` against a `NULL`-excluding, PostGIS `geography` footprint
// column): `min_lon <= max_lon` and `min_lat <= max_lat` is this message's own well-formedness
// rule -- `crate::catalog_selector` (`av-gateway`) refuses a `CatalogQuery.bbox` that
// violates it before any query reaches the catalog tier at all, typed and counted.
message GeoBbox {
  double min_lon = 1;
  double min_lat = 2;
  double max_lon = 3;
  double max_lat = 4;
}

// `DataGatewayService.Query`'s `GATEWAY_SELECTOR_CATALOG` payload (`authority.proto`'s
// `GatewayQueryRequest.catalog_query`, additive field 6) -- every filter
// `crates/av-catalog/src/query.rs::AssetQuery`/`find_assets` already implements, minus the
// label filter itself (D2's own clearance-ladder comparison, never a caller-suppliable
// field -- the caller's clearance comes from the verified token, `crate::auth::AuthContext::
// authenticate_query`, exactly like every other selector; see `crate::catalog_selector`'s own
// module doc for the full refusal chain, including how a `limit` of 0 or above
// `av_catalog::MAX_QUERY_LIMIT`, a `bbox` with `min >= max`, or a `time` with
// `end_tai_ns <= start_tai_ns` is refused rather than silently clamped or reinterpreted --
// unlike `find_assets` itself, which is an internal library function other, already-reviewed
// callers may legitimately want to clamp rather than refuse).
message CatalogQuery {
  // Unset (no `GeoBbox` at all) means "no extent filter" -- `crates/av-catalog/src/query.rs`'s
  // own module doc, "Extent": an asset with a `NULL` footprint is excluded from a
  // bbox-filtered query and included when no bbox filter is given at all.
  GeoBbox bbox = 1;
  // Unset means "no time filter" -- the identical NULL-handling rule as `bbox` above, for
  // `start_tai_ns`/`end_tai_ns` (`crates/av-catalog/src/query.rs`'s module doc, "Time"):
  // half-open `[start, end)` overlap.
  TemporalExtent time = 2;
  // Empty means "no media-type filter". Matched by exact equality against
  // `crates/av-catalog`'s own `assets.media_type` column -- never a glob or prefix match.
  string media_type = 3;
  // Empty means "no job-id filter" -- matched against `assets.job_id` (H2's own job-lineage
  // column, `crates/av-catalog/src/model.rs::CatalogAsset::job_id`).
  string job_id = 4;
  // The maximum number of `CatalogRecord`s this query may return. `crate::catalog_selector`
  // refuses (never clamps) a `limit` of 0 or above `av_catalog::MAX_QUERY_LIMIT` -- see this
  // message's own doc above.
  uint32 limit = 5;
}

// One matched `crates/av-catalog` asset, as `GatewayQueryResponse.catalog_records`
// (`authority.proto`, additive field 8) carries it.
message CatalogRecord {
  // `crates/av-catalog/src/model.rs::CatalogAsset::asset_id` -- this catalog's own identifier
  // (NOT `asset.sha256`; that message's own doc comment explains why the two are distinct).
  string asset_id = 1;
  // Every other asset field (`uri`, `sha256`, `size_bytes`, `media_type`, `label`,
  // `spatial_extent`, `temporal_extent`, `provenance`) as `entity.proto`'s own `AssetRef`
  // already shapes them -- `crates/av-catalog/src/model.rs::CatalogAsset::to_asset_ref`'s
  // exact, already-tested conversion, never a second, parallel asset shape declared here.
  // `AssetRef.attributes` is always empty on a value built this way (`to_asset_ref`'s own doc
  // comment: nothing in `crates/av-catalog`'s schema stores it today).
  AssetRef asset = 2;
  // `crates/av-catalog/src/model.rs::CatalogAsset::job_id` -- the job that produced this
  // asset, empty when none (H2's own job-lineage column, output side).
  string job_id = 3;
  // `crates/av-catalog/src/model.rs::CatalogAsset::created_tai_ns` -- this catalog entry's own
  // creation epoch, TAI nanoseconds.
  int64 created_tai_ns = 4;
  // `crates/av-catalog/src/model.rs::CatalogAsset::footprint_wkt` -- the geodetic footprint as
  // WKT text (e.g. `"POLYGON((...))"`), empty when the asset has no geodetic meaning at all
  // (mirrors that field's own `Option<String>` -- `None` renders as the empty string on this
  // proto3 field, exactly like `job_id` above).
  string footprint_wkt = 5;
}

// H3a (`docs/heavy-plan.md`): the job runner's own wire shapes. `crates/av-jobs` is this
// track's durable, hash-chained job queue plus the runner that drains it -- see that crate's
// own module doc for why the queue is a file-backed hash chain (the `av-ingest`/`av-edge`
// pattern, reimplemented rather than depended on) rather than a broker this round.

// What kind of executor a `JobSpec.executor` names -- how `crates/av-jobs::runner::Runner`
// actually runs the job, once every input has been fetched and hash-verified. See
// `JobSpec.executor`'s own doc comment.
enum JobExecutorKind {
  JOB_EXECUTOR_KIND_UNSPECIFIED = 0;
  // A local subprocess, argv in `JobSpec.command` -- `crates/av-jobs::runner::ProcessExecutor`.
  JOB_EXECUTOR_KIND_PROCESS = 1;
  // A labelled container, `JobSpec.container_image`/`container_image_digest`. Deferred this
  // round: `crates/av-jobs::runner::Runner::run_one` refuses this kind with a typed, recorded
  // `JOB_FAILURE_KIND_EXECUTOR_UNAVAILABLE`, never a silent skip -- see that crate's own module
  // doc.
  JOB_EXECUTOR_KIND_CONTAINER = 2;
}

// Why `crates/av-jobs::runner::Runner::run_one` produced a `JobCompletion` with `ok == false`.
// Every variant names the single step of the run that refused -- see `JobCompletion.failure`
// and `Runner::run_one`'s own doc for the fixed order these are checked in (unsupported kind,
// then label, then each input, then the executor, then each output).
enum JobFailureKind {
  JOB_FAILURE_KIND_UNSPECIFIED = 0;
  // No `AssetRef` named by `JobSpec.inputs` could be fetched from the configured
  // `ObjectSource`.
  JOB_FAILURE_KIND_INPUT_MISSING = 1;
  // An input was fetched, but its recomputed SHA-256 does not match the `AssetRef`'s own
  // `sha256` -- never handed to the executor (`Runner::run_one`'s own doc, the input-fetch
  // step).
  JOB_FAILURE_KIND_INPUT_HASH_MISMATCH = 2;
  // `JobSpec.executor` names an executor kind this round's `Runner` has no implementation for
  // (`JOB_EXECUTOR_KIND_CONTAINER` only, this round).
  JOB_FAILURE_KIND_EXECUTOR_UNAVAILABLE = 3;
  // `JOB_EXECUTOR_KIND_PROCESS`'s own command could not even be spawned (e.g. the executable
  // named by `JobSpec.command[0]` does not exist).
  JOB_FAILURE_KIND_EXECUTOR_START_FAILED = 4;
  // `JOB_EXECUTOR_KIND_PROCESS`'s own command exited with a non-zero status --
  // `JobFailure.exit_code` names it.
  JOB_FAILURE_KIND_NONZERO_EXIT = 5;
  // An `Executor`-produced output was refused by the configured `ObjectSink` -- including the
  // "more than one manifest output" and "a manifest output on a job kind that declares none"
  // refusals (`crates/av-jobs::runner::Runner::run_one`'s own doc, the output-sink step).
  JOB_FAILURE_KIND_OUTPUT_REJECTED = 6;
  // `JobSpec.label` is not on the configured `av_label::ClearanceLadder`.
  JOB_FAILURE_KIND_LABEL_REFUSED = 7;
  // `JobSpec.kind` names no registered `Executor`.
  JOB_FAILURE_KIND_UNSUPPORTED_JOB_KIND = 8;
}

// One job as submitted to the durable queue (`crates/av-jobs::queue::JobQueue::submit`) -- the
// caller's own request, recorded byte for byte on the log before the runner ever sees it.
message JobSpec {
  // The queue's own identity for this job -- caller-supplied, stable, and unique for the life
  // of the queue (`crates/av-jobs::queue::JobQueue::submit` typed-refuses a second `JobSpec`
  // submitted under a `job_id` already on the log, rather than silently accepting a second
  // entry).
  string job_id = 1;
  // What `crates/av-jobs::runner::Runner` dispatches on -- looked up in the runner's own
  // `kind -> Executor` registry. Not an enum: this track's own tiler (`"tiler"`, H3b) is the
  // only kind this round names, and a future job kind is additive data, not a wire change.
  string kind = 2;
  // Every input this job reads, by hash -- `entity.proto`'s own `AssetRef`, never a second,
  // parallel asset shape. `crates/av-jobs::runner::Runner::run_one` fetches each one through
  // the configured `ObjectSource` and hash-verifies it (`JOB_FAILURE_KIND_INPUT_HASH_MISMATCH`
  // on a mismatch) before ever handing its bytes to an `Executor`.
  repeated AssetRef inputs = 3;
  // Job-kind-specific parameters, e.g. the tiler's zoom range or output format. Generated as a
  // `BTreeMap` (`crates/av-cdm/build.rs`'s `.btree_map(["."])`), so this field's own encoding
  // is a deterministic function of its key/value pairs regardless of insertion order -- the
  // property `JobCompletion.spec_sha256`'s whole design rests on (a `HashMap`-backed map would
  // make the identical logical `JobSpec` hash differently run to run, which would make
  // `spec_sha256` useless as a record of "which spec produced this completion").
  map<string, string> parameters = 4;
  // The label every output this job produces inherits. Checked against the configured
  // `av_label::ClearanceLadder` before the job ever runs (`JOB_FAILURE_KIND_LABEL_REFUSED` on
  // a label not on that ladder).
  Label label = 5;
  // When this job was submitted, TAI nanoseconds -- from the submitter's own injected
  // `crates/av-jobs::clock::Clock`, never read from the system clock inside library code.
  int64 requested_tai_ns = 6;
  // How `crates/av-jobs::runner::Runner` runs this job -- see `JobExecutorKind`'s own doc.
  JobExecutorKind executor = 7;
  // `JOB_EXECUTOR_KIND_PROCESS`: the argv `crates/av-jobs::runner::ProcessExecutor` spawns,
  // `command[0]` the executable. Empty for an in-process job kind (none registered this
  // round).
  repeated string command = 8;
  // `JOB_EXECUTOR_KIND_CONTAINER` only: the image reference. Unused this round -- see
  // `JOB_FAILURE_KIND_EXECUTOR_UNAVAILABLE`.
  string container_image = 9;
  // `JOB_EXECUTOR_KIND_CONTAINER` only: the recorded digest of `container_image` (question
  // 212's "a test trusts an image only after comparing it to its recorded digest" rule,
  // carried onto this field for the round that implements the container executor). Unused
  // this round.
  string container_image_digest = 10;
}

// Why `crates/av-jobs::runner::Runner::run_one` produced `ok == false` -- set iff
// `JobCompletion.ok` is false (`JobCompletion.failure`'s own doc).
message JobFailure {
  JobFailureKind kind = 1;
  // Human-readable detail: which input, which command's exit code, which output was rejected
  // and why.
  string detail = 2;
  // The failed process's exit code. Meaningful only when `kind ==
  // JOB_FAILURE_KIND_NONZERO_EXIT`; 0 otherwise (proto3's own `int32` default, not a sentinel
  // this message invents).
  int32 exit_code = 3;
}

// `crates/av-jobs::runner::Runner::run_one`'s own result, appended to the log
// (`crates/av-jobs::queue::JobQueue::complete`) whether the job succeeded or not -- `run_one`
// itself never returns an `Err`; every failure path becomes a `JobCompletion` with
// `ok == false` and `failure` set, because a job that fails must leave a durable record, not
// an error a caller might drop (`crates/av-jobs`'s own crate doc explains why).
message JobCompletion {
  // The `JobSpec.job_id` this completes.
  string job_id = 1;
  // Hex SHA-256 of the submitted `JobSpec`'s own `prost::Message::encode_to_vec` --
  // recomputed by the runner itself from the `JobSpec` it actually ran, never carried forward
  // from whatever the submitter claimed (`crates/av-jobs::runner::Runner::run_one`'s own doc).
  string spec_sha256 = 2;
  // The inputs as actually used, by hash, in `JobSpec.inputs`' own order -- hex SHA-256, one
  // per input, recorded once `JOB_FAILURE_KIND_INPUT_HASH_MISMATCH`'s own verification has
  // passed for that input.
  repeated string input_sha256 = 3;
  // Every asset this job produced, as stored by the configured `ObjectSink`.
  repeated AssetRef outputs = 4;
  // H3b's tile-set identity: the `sha256` of whichever `outputs` entry has `manifest == true`
  // (`crates/av-jobs::runner::JobOutput::manifest`) -- empty when this job's kind has no
  // manifest output at all. Exactly one output may be the manifest;
  // `crates/av-jobs::runner::Runner::run_one` refuses (`JOB_FAILURE_KIND_OUTPUT_REJECTED`) a
  // job that tries to produce more than one, or a manifest output on a job kind that declares
  // none.
  string manifest_sha256 = 5;
  // When the runner began executing this job, TAI nanoseconds, from the runner's own injected
  // `Clock`.
  int64 started_tai_ns = 6;
  // When the runner finished (successfully or not), TAI nanoseconds, from the same `Clock`.
  int64 finished_tai_ns = 7;
  bool ok = 8;
  // Set iff `ok == false` -- see this message's own doc.
  JobFailure failure = 9;
}

// One record of `crates/av-jobs::log::JobLog`'s durable, hash-chained queue file -- the
// payload that crate's record framing hashes and appends (`crates/av-jobs/src/log.rs`'s own
// module doc has the exact on-disk byte layout; this message is only ever the framed
// payload, never the frame's own length/hash header).
message JobLogRecord {
  oneof event {
    // Appended by `crates/av-jobs::queue::JobQueue::submit`.
    JobSpec submitted = 1;
    // Appended by `crates/av-jobs::queue::JobQueue::complete`.
    JobCompletion completed = 2;
  }
}
