[workspace]
resolver = "2"
members = ["crates/gmat-sys", "crates/av-cdm", "crates/av-dynamics", "crates/av-codec", "crates/av-kernel", "crates/av-grpc", "crates/av-dynamics-service", "crates/av-lockstep", "crates/av-lockstep-shim", "crates/av-run", "crates/av-sweep", "crates/av-command", "crates/av-edge", "crates/av-ingest", "crates/av-ingest-client", "crates/av-track", "crates/av-gateway", "crates/av-proposer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/altavista"

[workspace.dependencies]
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Question 207 (av-lockstep's host-wide docker-test lock, crates/av-lockstep/src/
# docker_test_lock.rs): a raw `flock(2)` call is the one part of that fix with no equivalent in
# the standard library, so this is a genuinely new dependency, not a substitute for one already
# in the tree. Why a dependency at all, and why this one: a lock file with a PID in it, or any
# `Drop`-based guard with no kernel-owned resource behind it, cannot survive `SIGKILL` (a killed
# process never runs its own `Drop` impls) -- `flock` can, because the lock is attached to the
# open file description, which the kernel itself releases when a killed process's file
# descriptors are closed, with no userspace code involved. `libc` is MIT/Apache-2.0 (already
# `allow`ed by deny.toml), already present in Cargo.lock transitively (0.2.189, pulled in by
# several existing dependencies), and is not crypto-adjacent -- ADR-004's "no ring, no bundled
# crypto" rule has nothing to do with a raw syscall wrapper. Never add `fs2`/`fs4`/`nix` for
# this: `libc::flock` is the whole need, and every one of those pulls in far more than that.
libc = "0.2"
# Matches spoore/Cargo.toml's pin: av-cdm's spoore.v0 adapter needs to name
# `nalgebra::DMatrix<f64>` (the type spoore-cdm's own accessors return) directly.
nalgebra = "0.33"
# Path dependency onto spoore's own CDM crate (question 12: spoore crates by
# path dependency). Versions above are kept aligned with spoore/Cargo.toml
# (edition 2021, rust-version 1.85, prost 0.13) so the two workspaces can share
# a lockfile-free path dependency without a version conflict.
spoore-cdm = { path = "/Users/probe/code/spoore/crates/spoore-cdm" }

[profile.release]
debug = 1
