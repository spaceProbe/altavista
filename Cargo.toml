[workspace]
resolver = "2"
members = ["crates/gmat-sys", "crates/av-cdm", "crates/av-dynamics", "crates/av-codec", "crates/av-kernel", "crates/av-grpc", "crates/av-dynamics-service", "crates/av-lockstep", "crates/av-lockstep-shim", "crates/av-run", "crates/av-sweep", "crates/av-command", "crates/av-edge", "crates/av-ingest", "crates/av-ingest-client", "crates/av-track", "crates/av-gateway", "crates/av-proposer", "crates/av-store", "crates/av-catalog"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Question 208(a): measured, not guessed (cargo +<version> check -p av-command, then
# --workspace, on this host, 2026-09-15). regorus 0.12.0 (pinned in Cargo.lock) calls
# Vec::len/Vec::is_empty/Vec::as_slice from a const fn, which needs the
# const_vec_string_slice stabilisation:
#   - 1.86.0 FAILS: "`alloc::vec::Vec::<T, A>::len` is not yet stable as a const fn"
#     (regorus-0.12.0/src/lookup.rs:135, value/array/mod.rs:36/41/71), with
#     "help: add `#![feature(const_vec_string_slice)]` to the crate attributes to enable".
#   - 1.87.0 PASSES: `cargo +1.87.0 check -p av-command` finishes clean (one pre-existing,
#     unrelated dead_code warning in av-command's own audit.rs), and so does
#     `cargo +1.87.0 check --workspace` (GMAT_ROOT set) -- no other crate in the workspace
#     needs a newer toolchain than av-command does.
# 1.86.0 and 1.87.0 are adjacent minor releases, so 1.87 is the real floor, not an estimate
# bracketed by untested versions in between.
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/altavista"

[workspace.dependencies]
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Question 207 (av-lockstep's host-wide docker-test lock, crates/av-lockstep/src/
# docker_test_lock.rs): a raw `flock(2)` call is the one part of that fix with no equivalent in
# the standard library, so this is a genuinely new dependency, not a substitute for one already
# in the tree. Why a dependency at all, and why this one: a lock file with a PID in it, or any
# `Drop`-based guard with no kernel-owned resource behind it, cannot survive `SIGKILL` (a killed
# process never runs its own `Drop` impls) -- `flock` can, because the lock is attached to the
# open file description, which the kernel itself releases when a killed process's file
# descriptors are closed, with no userspace code involved. `libc` is MIT/Apache-2.0 (already
# `allow`ed by deny.toml), already present in Cargo.lock transitively (0.2.189, pulled in by
# several existing dependencies), and is not crypto-adjacent -- ADR-004's "no ring, no bundled
# crypto" rule has nothing to do with a raw syscall wrapper. Never add `fs2`/`fs4`/`nix` for
# this: `libc::flock` is the whole need, and every one of those pulls in far more than that.
libc = "0.2"
# Matches spoore/Cargo.toml's pin: av-cdm's spoore.v0 adapter needs to name
# `nalgebra::DMatrix<f64>` (the type spoore-cdm's own accessors return) directly.
nalgebra = "0.33"
# Path dependency onto spoore's own CDM crate (question 12: spoore crates by
# path dependency). Versions above are kept aligned with spoore/Cargo.toml
# (edition 2021, prost 0.13) so the two workspaces can share a lockfile-free path dependency
# without a version conflict. spoore/Cargo.toml's own declared rust-version is out of this
# workspace's control (question 12) and is not asserted here; this workspace's own floor is
# measured above (question 208(a)) and is 1.87, not 1.85.
#
# Question 219(c): relative sibling path, not an absolute one -- a clone of this repo placed
# anywhere, with a spoore checkout beside it (`../spoore` from this file), builds; an absolute
# `/Users/probe/code/spoore/...` only ever worked on this one host. Matches the sibling-checkout
# default the two `services/*/build-image.sh` scripts' `SPOORE_ROOT` override now uses
# (question 219(b)) -- both conventions assume the same layout: spoore checked out next to this
# repo's own root, never a fixed absolute path baked into committed source.
spoore-cdm = { path = "../spoore/crates/spoore-cdm" }

[profile.release]
debug = 1
