# SosConfiguration (proto/altavista/v1/system.proto), YAML transcoding -- native open items, task 6
# (docs/open-questions.md question 254): the two-spacecraft RPO pair of drms/demo_two_spacecraft.sos.yaml
# with BOTH spacecraft on ONE ground station. Read that file's header for the spacecraft (six
# instances each, the attitude loops, the flight computers, the thrusters, the chaser-only
# telecommand); everything here is byte-identical to it except the ground segment:
#   - `ground_chaser` and `ground_target` (two tracking channels, one per spacecraft, because
#     `crate::drm::ground::GroundStationModel` decoded only `Inbox::last_on_port("tm_in")`: with two
#     spacecraft on one port it silently dropped every frame but the last, so the chaser, which sorts
#     before the target in the router's delivery order (question 108), was never seen) are replaced by
#     ONE instance, `ground`;
#   - `<sc>_flight.tm_out -> ground.tm_in`, FRAMED, `link_model: "latency"`, for both spacecraft: two
#     senders on one station port, one frame from each in the same step. The station now handles every
#     frame on the port in the router's order and keeps contact state per sender.
#   - `ground` is drms/demo_ground_segment_ground_multi.system.yaml, the station system of
#     drms/demo_ground_segment_ground.system.yaml plus a declared `output.frames_handled` (the count
#     of telemetry frames the station has handled, which the DRM's measure reads at the end).
# `ground_cmd` and the telecommand to the chaser are unchanged.
