# SosConfiguration (proto/altavista/v1/system.proto), YAML transcoding -- M25.3 (question 173).
# Three BINDING_KIND_MODEL instances -- "attitude" reuses the existing, untouched
# drms/demo_attitude_sensors_truth.system.yaml (`attitude_sensors_truth_sys`) verbatim (no fixture
# this task is out of scope to touch is modified: this file only *references* it by
# `system_id`), "startracker" and "imu" are this task's own new, target-populated codec fixtures
