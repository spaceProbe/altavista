# SosConfiguration (proto/altavista/v1/system.proto), YAML transcoding -- M10.1
# (docs/open-questions.md question 97: impulsive maneuvers in the DRM executor). One instance
# ("leo_mvr"), bound to the *golden's own* leo_sys SystemDefinition
# (drms/leo_1day_golden.system.yaml -- same vehicle, same JGM2 8x8 + Sun/Moon force model,
# unchanged) via BINDING_KIND_MODEL. step_rate_hz = 10 matches leo_1day_golden.sos.yaml's own
# native integration rate (this golden pins the burn, not a differently-tuned integrator); this
# DRM's own output sampling (DrmOptions.sample_interval_s, in the .drm.yaml) is coarser (60 s)
# since goldens/leo_1day_maneuver_vnb.json only records the pre-burn/post-burn/final epochs, not
# a full 10 Hz trajectory -- see drms/README.md's "leo_1day_maneuver_vnb" section.
id: leo_sos_maneuver_vnb
version: "1"
name: LEO maneuver golden (VNB burn), single instance
instances:
  - name: leo_mvr
    system_id: leo_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: leo_sys
    step_rate_hz: 10.0
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (M10.1)"
