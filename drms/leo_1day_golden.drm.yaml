# flipped character here) is refused by the executor, not silently accepted -- see
# tests/drm_executor.rs::a_tampered_drm_hash_is_refused.
hash: "4694f388692c23d86e7f54baf5b087b4821b1ff01c037a4e7f82403b7c45bc43"
