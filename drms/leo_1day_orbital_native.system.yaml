# SystemDefinition: the native-model counterpart of leo_1day_golden.system.yaml -- the same JGM2
# 8x8 + Sun/Moon LEO physics with `dynamics_model` swapped from `gmat.` to `orbital.`, so the
# whole bundle (this file, leo_1day_orbital_native.sos.yaml, leo_1day_orbital_native.drm.yaml)
# names only native models and runs in an `av-run` built with `--no-default-features` (no GMAT
# linked): `tests/test_av_run_no_gmat.py`, `crates/av-kernel/tests/orbital_no_gmat_demo.rs`.
#
# The one-word swap alone is refused (the golden's state is Keplerian, and the native model has
# no GMAT to convert it: DrmError::OrbitalRequiresCartesianState), so the six elements
# SMA/ECC/INC/RAAN/AOP/TA = 6878 km / 0.001 / 51.6 deg / 30 deg / 0 / 0 are replaced by the
# Cartesian state of the same orbit (km, km/s, EarthMJ2000Eq), converted offline with the
# standard Keplerian-to-Cartesian composition at JGM2's own mu (3.986004415e14 m^3/s^2) -- the
# conversion `orbital_no_gmat_demo.rs` uses. Every other parameter, `force_model.golden_ref`
# and the (inert on the native path) ballistic properties included, is verbatim from the golden.
id: leo_orbital_native_sys
version: "1"
name: LEO JGM2 8x8 + Sun/Moon, native orbital model
dynamics_model: orbital.earth.jgm2_8x8.sun_moon
state_space_id: gmat.orbital.cartesian6
state_space:
  id: gmat.orbital.cartesian6
  components:
    - label: pos_x
      unit: UNIT_METER
    - label: pos_y
      unit: UNIT_METER
    - label: pos_z
      unit: UNIT_METER
    - label: vel_x
      unit: UNIT_METER_PER_SECOND
    - label: vel_y
      unit: UNIT_METER_PER_SECOND
    - label: vel_z
      unit: UNIT_METER_PER_SECOND
parameters:
  - name: force_model.central_body
    string_value: Earth
  - name: force_model.gravity_file
    string_value: JGM2.cof
  - name: force_model.gravity_degree
    value: 8
  - name: force_model.gravity_order
    value: 8
  - name: force_model.point_masses
    string_value: "Luna,Sun"
  - name: force_model.golden_ref
    string_value: leo_1day_jgm2_8x8_sunmoon
  - name: spacecraft.CoordinateSystem
    string_value: EarthMJ2000Eq
  - name: spacecraft.DisplayStateType
    string_value: Cartesian
  - name: spacecraft.X
    value: 5950.56620450214
  - name: spacecraft.Y
    value: 3435.5609999999997
  - name: spacecraft.Z
    value: 0.0
  - name: spacecraft.VX
    value: -2.366666364194521
  - name: spacecraft.VY
    value: 4.09918638734922
  - name: spacecraft.VZ
    value: 5.971979629264224
  - name: spacecraft.DryMass
    value: 500.0
  - name: spacecraft.Cd
    value: 2.2
  - name: spacecraft.Cr
    value: 1.8
  - name: spacecraft.DragArea
    value: 5.0
  - name: spacecraft.SRPArea
    value: 5.0
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "hand-authored from leo_1day_golden.system.yaml (N6 native model)"
# SHA-256 of the canonical encoding with this field cleared -- `cargo run -p av-kernel --example
# drm_hash -- system drms/leo_1day_orbital_native.system.yaml`.
hash: "b99e5135132eda7594fc54fc93dad6dde97ede3a888d638554a3a709fcd82db6"
