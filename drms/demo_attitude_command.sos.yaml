# SosConfiguration (proto/altavista/v1/system.proto), YAML transcoding -- A3.1
# (D8: "a new fixture family... adding a ground instance and the connection to the controller's
# new command port"). Derived from `drms/demo_attitude_control.sos.yaml` (unchanged: same four
# instances -- `attitude`/`startracker`/`imu`/`controller` -- same seventeen connections) PLUS a
# fifth instance, `ground` (reusing `drms/demo_ground_command_ground.system.yaml`'s own
# `ground_command_demo_ground_sys` completely unchanged -- a non-physical dispatch instance with
# no live model logic of its own, exactly `crate::drm::executor::run_shared_group`'s own
# command-dispatch code needs), and one new FRAMED connection: `ground.cmd_out ->
# controller.mode_in` (`crate::drm::controller::AttitudeControllerSpec::consume_framed_port`'s
# own new A3.1/D7 command port, resolved on `drms/demo_attitude_command_controller.system.yaml`).
#
# `controller`'s own new `mode_ack_out` port is declared (that system's own file) but **not**
# connected to anything here -- mirrors `demo_ground_command_ground.system.yaml`'s own identical,
# already-precedented choice ("no ack_in port is declared... it is simply never routed anywhere
# -- harmless, not an error," that file's own header comment): this fixture's own acceptance
# test does not exercise ack correlation on the ground's receiving end, only that the ack packet
# is genuinely sent (`crate::router::Router`'s own port-traffic recording proves the OUT emission
# regardless of whether anything downstream consumes it).
id: attitude_command_sos
version: "1"
name: Closed-loop attitude control with a ground-issued mode command (A3.1/D7)
instances:
  - name: attitude
    system_id: attitude_control_truth_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_truth_sys
  - name: startracker
    system_id: attitude_control_startracker_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_startracker_sys
  - name: imu
    system_id: attitude_control_imu_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_imu_sys
  - name: controller
    system_id: attitude_command_controller_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_command_controller_sys
  - name: ground
    system_id: ground_command_demo_ground_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: ground_command_demo_ground_sys
connections:
  - from_instance: attitude
    from_port: truth_qx
    to_instance: startracker
    to_port: truth_qx
