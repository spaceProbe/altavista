# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- A3.1
# (`docs/aiplane-plan.md`'s A3 milestone: "an external command source that dispatches Commands
# into the kernel's existing telecommand path"). **Deliberately zero `scenario.events`** -- every
# command this run's own trajectory sees comes from a `crate::drm::command_source::
# ExternalCommandSource` the test wires through `RunConfig.command_source`, never from a
# DRM-declared `command` `ScenarioEvent`. Reuses `drms/demo_command.sos.yaml` (and, through it,
# `demo_command_flight.system.yaml`/`demo_command_ground.system.yaml`) completely unchanged --
# `flight` already declares `port.consume_framed`/`port.consume_framed_field=accel_scale`/
# `port.ack_framed`, and `ground` already declares `port.cmd_out` -- so this fixture needs no new
# system definitions at all, only a DRM with an empty command scenario naming that same topology.
#
# crates/av-kernel/tests/external_command_source.rs drives this fixture.
