# SystemDefinition (proto/altavista/v1/system.proto), YAML transcoding -- M25.1
# (docs/sil-plan.md's M25 milestone: "ground segment as a system").
#
# The demo's flight-side telemetry source: `crate::drm::binding::ConstantAccelModel`
# (dynamics_model `native.*` -> `crate::registry::ModelKind::Native`, the same closed-form
# double-integrator every other native placeholder instance in this repository uses), with
# `port.emit_framed` set (M25.1 addition to `ConstantAccelSpec`/`ConstantAccelModel` -- see
# `crate::drm::binding::ConstantAccelSpec::emit_framed_port`'s own doc comment): every step, it
# broadcasts its own propagated Cartesian position (`state[0..3]`) as one CCSDS packet on the
# declared FRAMED `tm_out` port, decoded by drms/demo_ground_segment_ground.system.yaml's own
# `tm_in` port (identical apid 500, "same apid on both ends" convention).
#
# **Why a native ConstantAccelModel, not a real GMAT-propagated orbit, for this live demo.**
# `gmat_sys::model::GmatModel::step_with_ports` cannot itself encode a FRAMED CCSDS packet:
# `crates/gmat-sys` sits *below* `av-kernel` in this workspace's dependency graph (`av-kernel`
# depends on `gmat-sys`, never the reverse), and the CCSDS codec (`crate::codec`,
# `crate::ports::encode_ccsds_message`) lives in `av-kernel` -- a hard dependency-direction fact,
# not a missing feature (see this fixture's own report entry for the full account). Every
# existing FRAMED-CCSDS producer in this repository (StarTrackerModel, ImuModel,
# AttitudeControllerModel) is, for the identical reason, a native av-kernel-level model, never a
# raw GmatModel. `ConstantAccelModel`'s own closed-form kinematics (`x(t) = x0 + v0*t +
# 0.5*a*t^2`, `a = 0` here) is a genuine, declared, testable physical carrier -- not GMAT-fidelity
# over a long arc, but exact over this fixture's own short (900 s) window, which is all a
# rise-and-set pass needs to demonstrate the FRAMED port + router-latency + contact-event
# pipeline end to end. **The GMAT `ContactLocator` acceptance pin (this task's own required
# comparison) is measured separately, directly against a real GMAT-propagated arc — it does not
# depend on this fixture's own simplified flight-side kinematics at all**; see
# `crates/av-kernel/tests/ground_contact_gmat.rs`.
#
# `x0`/`v0` (Earth-fixed/ECEF metres, metres-per-second) were chosen so the resulting straight-
# line pass rises above and sets below the ground station's own 10-degree elevation mask within
# the fixture's own 900 s horizon -- computed directly from
# `crate::drm::ground::{geodetic_to_ecef_m, elevation_of}` (this repository's own, already-tested
# geometry, not hand arithmetic): AOS approximately 50 s, peak approximately 84 degrees at 420 s,
# LOS approximately 795 s (see this fixture's own report entry for the full printed table).
id: ground_segment_flight_sys
version: "1"
name: Native flight telemetry source for the ground-segment demo (M25.1)
dynamics_model: native.ground_segment_flight_demo
state_space_id: native.ground_segment_flight_demo.space
state_space:
  id: native.ground_segment_flight_demo.space
  components:
    - label: pos_x
      unit: UNIT_METER
    - label: pos_y
      unit: UNIT_METER
    - label: pos_z
      unit: UNIT_METER
    - label: vel_x
      unit: UNIT_METER_PER_SECOND
    - label: vel_y
      unit: UNIT_METER_PER_SECOND
    - label: vel_z
      unit: UNIT_METER_PER_SECOND
ports:
  - name: tm_out
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_OUT
    schema: ccsds.spp
    timing:
      latency_ns: 50000000
packet_codecs:
  - id: flight_tm_out_codec
    apid: 500
    is_command: false
    secondary_header_bytes: 0
    user_data_bytes: 24
    description: "own Earth-fixed Cartesian position telemetry, encoded (M25.1)"
    fields:
      - name: x
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_METER
        scale: 1.0
        offset: 0.0
      - name: y
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_METER
        scale: 1.0
        offset: 0.0
      - name: z
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_METER
        scale: 1.0
        offset: 0.0
parameters:
  - name: frame_id
    string_value: earth_fixed_demo_frame
  - name: accel.x
    value: 0.0
  - name: accel.y
    value: 0.0
  - name: accel.z
    value: 0.0
  - name: state.px
    value: -2169088.3299959777
    unit: UNIT_METER
  - name: state.py
    value: -6490320.479430026
    unit: UNIT_METER
  - name: state.pz
    value: 3263896.1976225306
    unit: UNIT_METER
  - name: state.vx
    value: 7399.291212052271
    unit: UNIT_METER_PER_SECOND
  - name: state.vy
    value: 1224.9447168121674
    unit: UNIT_METER_PER_SECOND
  - name: state.vz
    value: 0.0
    unit: UNIT_METER_PER_SECOND
  - name: port.emit_framed
    string_value: tm_out
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (M25.1)"
