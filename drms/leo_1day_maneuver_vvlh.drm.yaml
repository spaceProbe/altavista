# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- M11.3
# (docs/open-questions.md question 102): declares a burn "in VVLH", the way any caller
# targeting this platform's ratified AXES_KIND_VVLH (question 73, Z=-R, Y=-N, X=N x R; renamed
# from AXES_KIND_LVLH by M12.4 question 106 so the name never collides with GMAT's own literal
# ImpulsiveBurn Axes=LVLH) would write it. See drms/README.md's "leo_1day_maneuver_ric /
# leo_1day_maneuver_vvlh" section and altavista/FRAMES.md's "GMAT ImpulsiveBurn LVLH vs
# AXES_KIND_VVLH" section for the finding this fixture exists to pin down:
# goldens/leo_1day_maneuver_gmat_lvlh.json was generated by firing GMAT's own ImpulsiveBurn with
# Axes=LVLH (altavista's `Scenario.maneuver(frame="LVLH")`), which is measured to realize X=R,
# Z=N (i.e. AXES_KIND_RIC's convention) -- NOT this platform's ratified AXES_KIND_VVLH. Running
# *this* DRM (tagged AXES_KIND_VVLH, dv identical to the golden's own dv_lvlh_km_s) through
# crates/av-kernel's executor therefore does **not** reproduce the golden --
# crates/av-kernel/tests/drm_maneuver.rs measures and asserts the real (large) discrepancy
# explicitly, and separately proves that tagging the same dv AXES_KIND_RIC does reproduce it.
# Nothing here (or in that test) reorients the golden or av-kernel's ratified AxesKind::Vvlh to
# force a match.
#
# start_tai_ns/end_tai_ns/burn tai_ns: identical arithmetic to leo_1day_maneuver_ric.drm.yaml /
# leo_1day_maneuver_vnb.drm.yaml (same "01 Jan 2026 00:00:00Z" epoch, same 3600 s pre/post-burn
# windows).
#
# dv_x/dv_y/dv_z: 0.0, 20.0, 0.0 m/s -- the same three numbers as
# goldens/leo_1day_maneuver_gmat_lvlh.json's dv_lvlh_km_s = [0.0, 0.02, 0.0] (and, not by
# coincidence, leo_1day_maneuver_ric.drm.yaml's dv -- see the note above).
