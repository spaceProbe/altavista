# SystemDefinition (proto/altavista/v1/system.proto), YAML transcoding -- hilprep-3a
# (docs/open-questions.md question 242: the kernel binds a BINDING_KIND_BOARD instance).
#
# The board variant of `demo_attitude_control_controller_renode.system.yaml`: the identical
# `ports`/`packet_codecs` (copied verbatim -- the same cFS `services/cfs/apps/adcs` control law and
# the same packet shapes, now reached over a real link through the board's edge service,
# `av-edge-board`), bound by an instance with `BINDING_KIND_BOARD` and a `BoardBinding`
# (`edge_node_id`, `port_devices` mapping EVERY port of this system to the one device, e.g.
# "udp://10.0.0.7:5000" or "/dev/ttyUSB0@115200"; `binding::parse_board_spec`'s "one link per
# board instance" rule). The `BoardBinding` is on the SoS instance, not here; this file carries the
# kernel-side `board.*` parameters:
#
#   - `board.edge_address` -- `host:port` of the running `av-edge-board` (its `--grpc-addr`,
#     default 127.0.0.1:50081). Plaintext only on loopback (question 155); otherwise set
#     `board.tls` = 1 with `board.ca_file`/`board.client_cert`/`board.client_key`. The value below
#     is a placeholder: tests rewrite it to the service they start, a HIL-day run edits it (the
#     system hash must then be recomputed, see below).
#   - `board.seed_key` -- names an entry in `Scenario.seeds`, as `container.seed_key` does.
#   - optional `board.step_timeout_ms` (default 5000) and `board.bind_timeout_ms` (default 30000),
#     each 10..=600000: a silent board is a typed error after that long, never a hang.
#
# `dynamics_model`/`state_space_id`/`state_space`: as for every other container-shaped instance,
# a zero-component declared space (the board's state is opaque to the kernel).
#
# Nothing here has been run against a board: the repository's proofs use a fake guest behind the
# real `av-edge-board` (crates/av-kernel/tests/drm_board_*.rs).
id: attitude_control_controller_board_sys
version: "1"
name: Board-bound attitude controller (hilprep-3a) -- services/cfs/apps/adcs behind av-edge-board
dynamics_model: ""
# `"container.none"` -- the zero-component declared state space every other
# BINDING_KIND_CONTAINER fixture in this repository uses (e.g.
# crates/av-kernel/tests/drm_container.rs's own `docker_container_system` helper): a container
# instance's state is opaque to this kernel (M14.4's own "zero-order hold, no interpolation"
# rule), so there is nothing to declare beyond "zero-dimensional."
state_space_id: "container.none"
state_space:
  id: "container.none"
  components: []
ports:
  - name: startracker_in
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_IN
    schema: ccsds.spp
  - name: imu_in
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_IN
    schema: ccsds.spp
  - name: wheel_torque_out
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_OUT
    schema: ccsds.spp
packet_codecs:
  - id: controller_star_in_codec
    apid: 200
    is_command: false
    secondary_header_bytes: 0
    user_data_bytes: 32
    description: "star tracker attitude measurement, decoded (M23.4, copied from M22.4)"
    fields:
      - name: qx
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qy
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qz
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qw
        bit_offset: 192
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
  - id: controller_imu_in_codec
    apid: 201
    is_command: false
    secondary_header_bytes: 0
    user_data_bytes: 48
    description: "IMU rate + specific-force measurement, decoded (M23.4, copied from M22.4)"
    fields:
      - name: wx
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_RADIAN_PER_SECOND
        scale: 1.0
        offset: 0.0
      - name: wy
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_RADIAN_PER_SECOND
        scale: 1.0
        offset: 0.0
      - name: wz
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_RADIAN_PER_SECOND
        scale: 1.0
        offset: 0.0
      - name: ax
        bit_offset: 192
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_METER_PER_SECOND_SQUARED
        scale: 1.0
        offset: 0.0
      - name: ay
        bit_offset: 256
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_METER_PER_SECOND_SQUARED
        scale: 1.0
        offset: 0.0
      - name: az
        bit_offset: 320
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_METER_PER_SECOND_SQUARED
        scale: 1.0
        offset: 0.0
  - id: controller_wheel_torque_out_codec
    apid: 300
    is_command: true
    secondary_header_bytes: 0
    user_data_bytes: 24
    description: "reaction wheel torque command, wheel k aligned with body axis k (M23.4, copied from M22.4)"
    fields:
      - name: tau_1
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_NEWTON_METER
        scale: 1.0
        offset: 0.0
      - name: tau_2
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_NEWTON_METER
        scale: 1.0
        offset: 0.0
      - name: tau_3
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_NEWTON_METER
        scale: 1.0
        offset: 0.0
parameters:
  - name: board.edge_address
    string_value: "127.0.0.1:50081"
  - name: board.seed_key
    string_value: controller
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (hilprep-3a)"
