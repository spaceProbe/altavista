# SosConfiguration (proto/altavista/v1/system.proto), YAML transcoding -- native-ct-1
# (docs/open-questions.md question 245 (5): two spacecraft, each through its own cFS container, in
# one run; crates/av-kernel/tests/drm_two_spacecraft_cfs.rs). This file is the NATIVE form: both
# controllers are BINDING_KIND_MODEL (M22.4's `attitude_control_controller_sys`). The container
# test rebinds the two `*_controller` instances to BINDING_KIND_CONTAINER in memory exactly as
# tests/drm_attitude_control_cfs.rs rebinds the single one (the image digest is only known once the
# test has pushed the image to its throwaway registry), so the topology below is the topology of
# both runs.
#
# **Two spacecraft, an RPO pair, `chaser` and `target`.** Each owns six instances, named
# `<sc>_attitude`, `<sc>_startracker`, `<sc>_imu`, `<sc>_controller`, `<sc>_flight`, `<sc>_thruster`:
#   - the first four are drms/demo_attitude_control.sos.yaml's four instances with the same
#     seventeen connections (fourteen SIGNAL truth-to-sensor, two FRAMED sensor-to-controller, one
#     FRAMED `wheel_torque_out -> wheel_torque_in` closing the loop), prefixed. The systems are
#     reused unchanged: two instances of every system is the point.
#   - `<sc>_flight` is drms/demo_ground_segment_flight.system.yaml, unchanged: the spacecraft's
#     native telemetry source, broadcasting its Earth-fixed position as FRAMED telemetry (apid 500).
#   - `<sc>_thruster` is drms/demo_command_flight.system.yaml, unchanged: the spacecraft's native,
#     telecommandable propulsion channel. It integrates a constant thrust acceleration (0.05 m/s^2
#     along its z axis here; an instance override of the system's 1.0) whose throttle (`accel_scale`)
#     a FRAMED telecommand sets, and acknowledges the command with a FRAMED ack.
#
# **Why two native models per spacecraft carry telemetry and telecommand, and why not the cFS
# controller.** `ConstantAccelModel` resolves its telemetry-out codec with `binding::
# resolve_sensor_output`, which requires exactly one packet codec and exactly one FRAMED OUT port on
# the whole system, so one instance cannot both broadcast telemetry and consume/ack a telecommand
# (a binding.rs generalisation would couple them; not made here). The cFS controller cannot take the
# telecommand either: the cFS image accepts no input port but `imu_in` and `startracker_in`
# (services/cfs/apps/io_lockstep/fsw/src/io_lockstep_port_table.c; `handle_step` skips any other
# port) and services/cfs/apps/adcs has no command handler, so commanding it needs a change under
# services/cfs/** that moves the pinned RTEMS ELF. The telecommand therefore commands the
# spacecraft's native thruster model.
#
# **The two loops are distinguishable (a cross-wired controller cannot pass).** Declared, physical
# differences, all as `parameter_overrides` on the `target` instances:
#   - initial pointing error: `chaser_attitude` keeps the system's 0.2 rad about +z; `target_attitude`
#     starts 0.12 rad about +z (q0 = [0, 0, sin(0.06), cos(0.06)]). The critically damped closed form
#     of drms/demo_attitude_control.drm.yaml (tau = 20 s) then gives theta(30 s) = 0.111565 rad for
#     the chaser and 0.066939 rad for the target: 40% apart, far outside the 15% tracking bound.
#   - sensor noise streams: `startracker.seed` 1 / 3 and `imu.seed` 2 / 4 (chaser / target), so the
#     two spacecraft do not see one noise realisation twice.
#   - translational state: both flight computers start 43.4 s into the original pass of
#     drms/demo_ground_segment.drm.yaml (so the pass rises through the mask inside a 30 s window);
#     the chaser trails the target by 3 km along-track.
#
# **The ground segment** is three instances, all reusing existing systems unchanged:
#   - `ground_chaser` and `ground_target`: drms/demo_ground_segment_ground.system.yaml, two
#     tracking channels of the same Cape-Canaveral-like site. `crate::drm::ground::GroundStationModel`
#     decodes ONE telemetry port (`Inbox::last_on_port("tm_in")`: two spacecraft sharing one port
#     would drop one of them whenever both arrive in a step), so each spacecraft gets its own station
#     instance; a station model with several telemetry ports would be a model change, not made here.
#     Telemetry: `<sc>_flight.tm_out -> ground_<sc>.tm_in`, FRAMED, `link_model: "latency"`.
#   - `ground_cmd`: drms/demo_command_ground.system.yaml, the non-physical dispatch instance a
#     `command` Scenario.event is handed to the router from (crate::drm::command's "from"). The
#     telecommand is connected to the CHASER only: `ground_cmd.cmd_out -> chaser_thruster.cmd_in`
#     (and the ack back, `chaser_thruster.ack_out -> ground_cmd.ack_in`). `target_thruster.cmd_in`
#     and `.ack_out` are declared (same system) and deliberately unconnected: the telecommand cannot
#     reach the target because the topology has no edge to it.
id: two_spacecraft_sos
version: "1"
name: Two-spacecraft RPO pair, each with its own attitude loop, flight computer and thruster, one ground segment (native-ct-1)
instances:
  - name: chaser_attitude
    system_id: attitude_control_truth_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_truth_sys
  - name: chaser_startracker
    system_id: attitude_control_startracker_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_startracker_sys
  - name: chaser_imu
    system_id: attitude_control_imu_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_imu_sys
  - name: chaser_controller
    system_id: attitude_control_controller_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_controller_sys
  - name: chaser_flight
    system_id: ground_segment_flight_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: ground_segment_flight_sys
    step_rate_hz: 1.0
    parameter_overrides:
      - name: state.px
        value: -1850918.80787773
      - name: state.py
        value: -6437647.856607104
      - name: state.pz
        value: 3263896.1976225306
  - name: chaser_thruster
    system_id: command_demo_flight_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: command_demo_flight_sys
    step_rate_hz: 1.0
    parameter_overrides:
      - name: accel.z
        value: 0.05
  - name: target_attitude
    system_id: attitude_control_truth_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_truth_sys
    parameter_overrides:
      - name: attitude.q0.z
        value: 0.059964006479444595
      - name: attitude.q0.w
        value: 0.9982005399352042
  - name: target_startracker
    system_id: attitude_control_startracker_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_startracker_sys
    parameter_overrides:
      - name: startracker.seed
        value: 3.0
  - name: target_imu
    system_id: attitude_control_imu_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_imu_sys
    parameter_overrides:
      - name: imu.seed
        value: 4.0
  - name: target_controller
    system_id: attitude_control_controller_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_control_controller_sys
  - name: target_flight
    system_id: ground_segment_flight_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: ground_segment_flight_sys
    step_rate_hz: 1.0
    parameter_overrides:
      - name: state.px
        value: -1847959.0913929092
      - name: state.py
        value: -6437157.8787203785
      - name: state.pz
        value: 3263896.1976225306
  - name: target_thruster
    system_id: command_demo_flight_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: command_demo_flight_sys
    step_rate_hz: 1.0
    parameter_overrides:
      - name: accel.z
        value: 0.05
  - name: ground_chaser
    system_id: ground_station_demo_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: ground_station_demo_sys
    step_rate_hz: 1.0
  - name: ground_target
    system_id: ground_station_demo_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: ground_station_demo_sys
    step_rate_hz: 1.0
  - name: ground_cmd
    system_id: command_demo_ground_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: command_demo_ground_sys
    step_rate_hz: 1.0
