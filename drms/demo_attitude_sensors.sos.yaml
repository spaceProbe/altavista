# SosConfiguration (proto/altavista/v1/system.proto), YAML transcoding -- M22.2. Three
# BINDING_KIND_MODEL instances -- "attitude" (drms/demo_attitude_sensors_truth.system.yaml),
# "startracker" and "imu" (their own like-named *.system.yaml files) -- wired by fourteen
# `Connection`s: each of the seven `crate::drm::sensors::TRUTH_PORT_NAMES` from "attitude" to
# both "startracker" and "imu", zero-latency (no `link_model`), the identical topology
# `crate::drm::sensors::tests::attitude_instance_is_measured_by_both_sensors_through_the_real_
# router` builds and drives directly in Rust. M22.2b (`docs/open-questions.md` questions
# 142/149/151/152) wires "startracker."/"imu." into `crate::registry::kind_for`/`AnyModel`/
# `ModelRegistry`, so this SoS now also runs end to end through `av_kernel::drm::execute` --
# see `crates/av-kernel/tests/drm_attitude_sensors.rs` and
# drms/demo_attitude_sensors_truth.system.yaml's own header comment.
id: attitude_sensors_sos
version: "1"
name: Star tracker + IMU measuring a torque-free precession truth source (M22.2)
instances:
  - name: attitude
    system_id: attitude_sensors_truth_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_sensors_truth_sys
  - name: startracker
    system_id: attitude_sensors_startracker_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_sensors_startracker_sys
  - name: imu
    system_id: attitude_sensors_imu_sys
    binding:
      kind: BINDING_KIND_MODEL
      model:
        model_id: attitude_sensors_imu_sys
connections:
  - from_instance: attitude
    from_port: truth_qx
    to_instance: startracker
    to_port: truth_qx
  - from_instance: attitude
    from_port: truth_qy
    to_instance: startracker
    to_port: truth_qy
  - from_instance: attitude
    from_port: truth_qz
    to_instance: startracker
    to_port: truth_qz
  - from_instance: attitude
    from_port: truth_qw
    to_instance: startracker
    to_port: truth_qw
  - from_instance: attitude
    from_port: truth_wx
    to_instance: startracker
    to_port: truth_wx
  - from_instance: attitude
    from_port: truth_wy
    to_instance: startracker
    to_port: truth_wy
  - from_instance: attitude
    from_port: truth_wz
    to_instance: startracker
    to_port: truth_wz
  - from_instance: attitude
    from_port: truth_qx
    to_instance: imu
    to_port: truth_qx
  - from_instance: attitude
    from_port: truth_qy
    to_instance: imu
    to_port: truth_qy
  - from_instance: attitude
    from_port: truth_qz
    to_instance: imu
    to_port: truth_qz
  - from_instance: attitude
    from_port: truth_qw
    to_instance: imu
    to_port: truth_qw
  - from_instance: attitude
    from_port: truth_wx
    to_instance: imu
    to_port: truth_wx
