# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- M10.1
# (docs/open-questions.md question 97): "accept scenario events of kind maneuver ..., apply
# them between steps at the exact epoch, emit EVENT_KIND_MANEUVER, and pin against the altavista
# maneuver path (VNB burn) on a golden." See drms/README.md's "leo_1day_maneuver_vnb" section
# for how the numbers below were derived and
# goldens/gen_leo_1day_maneuver_vnb.py for how the golden itself was generated (altavista's own
# Scenario.maneuver, frame="VNB", never a hand re-derivation of the V/N/B formula).
#
# start_tai_ns: the same "01 Jan 2026 00:00:00Z" epoch leo_1day_golden.drm.yaml uses (see that
# file's own comment for the TAI arithmetic) -- 1767225637000000000. The burn is declared
# 3600 s (goldens/gen_leo_1day_maneuver_vnb.py's PRE_BURN_S) after that, and the scenario ends
# 3600 s (POST_BURN_S) after the burn: end_tai_ns = start_tai_ns + 7200e9.
id: drm_leo_1day_maneuver_vnb
version: "1"
name: LEO maneuver golden (VNB burn)
sos_configuration_id: leo_sos_maneuver_vnb
scenario:
  start_tai_ns: 1767225637000000000
  end_tai_ns: 1767232837000000000
  events:
    - id: burn1
      tai_ns: 1767229237000000000
      kind: maneuver
      instance: leo_mvr
      values:
        dv_x: 20.0
        dv_y: 0.0
        dv_z: 0.0
      attributes:
        frame_id: AXES_KIND_VNB
options:
  covariance: false
  default_step_rate_hz: 10.0
  sample_interval_s: 60.0
  real_time: false
  nearest_spd_projection: false
  accept_missing_stm_terms: false
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (M10.1)"
