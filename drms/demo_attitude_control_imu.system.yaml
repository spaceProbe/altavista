# SystemDefinition (proto/altavista/v1/system.proto), YAML transcoding -- M22.4. The IMU
# instance for drms/demo_attitude_control.sos.yaml: seven `PORT_KIND_SIGNAL` IN ports consuming
# `attitude_control_truth_sys`'s own truth broadcast, and one `PORT_KIND_FRAMED` OUT port
# (schema "ccsds.spp") carrying the noisy rate measurement to the native controller over
# `demo_attitude_control.sos.yaml`'s own Connection to that instance's declared `imu_in` port --
# field-for-field the same `crate::drm::sensors::ImuModel` shape as
# drms/demo_attitude_sensors_imu.system.yaml, a new `id`/APID/port name only.
id: attitude_control_imu_sys
version: "1"
name: IMU measuring the M22.4 closed-loop demo's truth attitude
dynamics_model: imu.control_demo
state_space_id: imu.control_demo.space
state_space:
  id: imu.control_demo.space
  components:
    - label: bias_gyro_x
      unit: UNIT_RADIAN_PER_SECOND
    - label: bias_gyro_y
      unit: UNIT_RADIAN_PER_SECOND
    - label: bias_gyro_z
      unit: UNIT_RADIAN_PER_SECOND
    - label: bias_accel_x
      unit: UNIT_METER_PER_SECOND_SQUARED
    - label: bias_accel_y
      unit: UNIT_METER_PER_SECOND_SQUARED
    - label: bias_accel_z
      unit: UNIT_METER_PER_SECOND_SQUARED
ports:
  - name: truth_qx
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qy
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qz
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qw
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wx
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wy
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wz
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: imu_meas
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_OUT
    schema: ccsds.spp
packet_codecs:
  - id: imu_meas_codec
    apid: 201
    is_command: false
    secondary_header_bytes: 0
    user_data_bytes: 48
    description: "IMU rate + specific-force measurement (M22.4)"
    fields:
      - name: wx
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_RADIAN_PER_SECOND
        scale: 1.0
        offset: 0.0
      - name: wy
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_RADIAN_PER_SECOND
        scale: 1.0
        offset: 0.0
      - name: wz
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_RADIAN_PER_SECOND
        scale: 1.0
        offset: 0.0
