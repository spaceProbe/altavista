# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- A3.3
# (`docs/aiplane-plan.md`'s A3 milestone: "the replay binding reproduces the trail bit for
# bit"). See `drms/demo_attitude_command_replay.sos.yaml`'s own header comment for exactly why
# this fixture drops the closed loop (`attitude`/`startracker`/`imu`) `demo_attitude_command.*
# .yaml` wires -- root-caused there, not repeated here.
#
# **Deliberately zero `scenario.events` AND zero `measures`/`objectives`.** The `mode` command
# this fixture's own acceptance test (`crates/av-kernel/tests/replay.rs`) drives comes entirely
# from a `crate::drm::command_source::ExternalCommandSource`, mirroring `drms/demo_external_
# command.drm.yaml`'s own identical choice, one binding kind over. Zero `measures`/`objectives`
# is the OTHER half of the same substitution `demo_attitude_command_replay.sos.yaml`'s header
# already explains: with no `startracker`/`imu` wired, `controller` never produces a `pointing_
# error_rad` output at all (live run or replayed), so a `measures` entry reading it would fail
# to evaluate (`DrmError::InvalidExpression`), not merely diverge -- this fixture's own test is
# about the command trail (`CommandTransition`/`PortCommand` events), not the control law, so
# there is nothing here for an `Objective`/`MeasureOfEffectiveness` to usefully score anyway.
