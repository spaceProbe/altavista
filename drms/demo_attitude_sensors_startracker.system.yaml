# SystemDefinition (proto/altavista/v1/system.proto), YAML transcoding -- M22.2. The star
# tracker instance for drms/demo_attitude_sensors.sos.yaml: seven `PORT_KIND_SIGNAL` IN ports
# consuming `attitude_sensors_truth_sys`'s own truth broadcast (see that file's header comment),
# and one `PORT_KIND_FRAMED` OUT port (`schema: "ccsds.spp"`) carrying the noisy attitude
# measurement as one CCSDS space packet per `crate::codec`/`crate::drm::sensors::
# star_tracker_packet_codec`'s declared field layout (`qx,qy,qz,qw`, four big-endian IEEE-754
# `binary64` fields, 32 user-data bytes).
#
# `crate::drm::sensors::parse_star_tracker_spec` is this system's own typed parameter parser;
# `crate::drm::sensors::StarTrackerModel` is the model these `startracker.*` parameters (plus
# this file's own declared `packet_codecs` entry) construct.
#
# M22.2b (`docs/open-questions.md` questions 142/149/151/152, decided by the lead):
# `dynamics_model: startracker.sensors_demo` now dispatches through
# `crate::registry::ModelKind::StarTracker` (`crate::registry::kind_for`) ->
# `crate::drm::binding::BindingPlan::StarTracker` -> `AnyModel::StarTracker` -- a real,
# `execute()`-runnable instance. The declared `output.seq` parameter below exposes this
# instance's own CCSDS sequence-count field as `output.startracker.seq@<time>`, which is how
# `crates/av-kernel/tests/drm_attitude_sensors.rs` observes -- through the public
# `av_kernel::drm::execute` entry point, not by reaching into `crate::router::Router` directly --
# that this instance actually pushed a real CCSDS packet onto its declared FRAMED `st_meas` port
# at its own declared 2 Hz rate, independent of the kernel's own step rate. See that test file's
# own doc comment for the exact expected emission count (stated before measuring).
id: attitude_sensors_startracker_sys
version: "1"
name: Star tracker measuring the M22.2 demo's truth attitude (M22.2)
dynamics_model: startracker.sensors_demo
state_space_id: startracker.sensors_demo.space
state_space:
  id: startracker.sensors_demo.space
  components: []
ports:
  - name: truth_qx
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qy
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qz
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qw
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wx
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wy
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wz
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: st_meas
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_OUT
    schema: ccsds.spp
packet_codecs:
  - id: st_meas_codec
    apid: 100
    is_command: false
    secondary_header_bytes: 0
    user_data_bytes: 32
    description: "star tracker attitude measurement (M22.2)"
    fields:
      - name: qx
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qy
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qz
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qw
        bit_offset: 192
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
parameters:
  - name: startracker.update_rate_hz
    value: 2.0
    unit: UNIT_HERTZ
  - name: startracker.seed
    value: 1.0
  - name: startracker.noise_sigma_rad
    value: 0.00001
    unit: UNIT_RADIAN
  - name: output.seq
    unit: UNIT_DIMENSIONLESS
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (M22.2)"
