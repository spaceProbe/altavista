# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- native-ct-1
# (docs/open-questions.md question 245 (5): two spacecraft, each through its own cFS container, in
# one run; crates/av-kernel/tests/drm_two_spacecraft_cfs.rs) over drms/demo_two_spacecraft.sos.yaml
# (read its header for the topology: an RPO pair, `chaser` and `target`, each with its own attitude
# plant, star tracker, IMU, controller, flight computer and thruster; one ground segment; a telecommand to
# the chaser only).
#
# 30 s at the fixture's 10 Hz default step (300 steps; 30 s = 1.5 tau, the same window as
# tests/drm_attitude_control_cfs.rs), 1 Hz output grid, no faults, no objectives (the cFS-bound
# controller exposes no `output.*`, see drms/demo_attitude_control_controller_cfs.system.yaml; the
# test scores the truth plants' quaternions instead).
#
# ---------------------------------------------------------------------------------------------
# Expected behaviour, stated BEFORE running (crates/av-kernel/tests/drm_two_spacecraft_cfs.rs
# measures against exactly these numbers)
# ---------------------------------------------------------------------------------------------
#
# Attitude, per spacecraft. The control law and gains are drms/demo_attitude_control.drm.yaml's
# (kp = 0.25, kd = 5.0, Jz = 50, critically damped, tau = 2*Jz/kd = 20 s):
#   theta(t) / theta(0) = (1 + t/tau) * exp(-t/tau)        theta(30 s)/theta(0) = 2.5*exp(-1.5)
#                                                                              = 0.5578254
#   chaser: theta(0) = 0.2 rad   =>  theta(30 s) = 0.1115651 rad
#   target: theta(0) = 0.12 rad  =>  theta(30 s) = 0.0669390 rad
# The two loops differ by 40% at the end, so a controller driving the other spacecraft's plant
# (cross-wired wheel_torque_out connections) cannot satisfy the 15% per-spacecraft tracking bound.
#
# Ground segment. The flight computers start 43.4 s into the original pass of
# drms/demo_ground_segment.drm.yaml (same Cape-Canaveral-like site, 10 degree mask), so the
# target rises through the mask at t = 5.19 s and the chaser (3 km behind it along-track) at
# t = 5.59 s, both inside the window: exactly one CONTACT_START on `ground_target` and one on
# `ground_chaser`, no CONTACT_END (the pass sets after the 30 s window). Telemetry: one position
# packet per flight step (1 Hz) over each FRAMED link, so 30 records IN at each station.
#
# Telecommand. `cmd1` at t = 15 s commands the chaser's thruster throttle (`accel_scale`) from 1
# to 4. The dispatch instance's link carries 1.5 s + 1.5 s of declared port latency (3 s), so
# `chaser_thruster` decodes and applies it at the 1 Hz step starting at t = 18 s (the test reads the
# REAL applied epoch off the PORT_COMMAND event rather than hard-coding it). Expected: exactly one
# EVENT_KIND_PORT_COMMAND (field accel_scale, value 4.0) on `chaser_thruster` and none on
# `target_thruster`; the five COMMAND_TRANSITION events for cmd1; one ack packet (apid 701) from
# `chaser_thruster` and none from `target_thruster`; and the thrusters' trajectories follow the
# piecewise closed form z(t) = 0.5*a*t^2 for the target (a = 0.05 m/s^2, never commanded) and, for
# the chaser, z(t) = z(t_a) + v(t_a)*(t - t_a) + 0.5*4*a*(t - t_a)^2 after the applied epoch t_a.
# The flight computers (telemetry sources) coast on x0 + v0*t and are not affected by the command.
id: two_spacecraft_drm
version: "1"
name: "Two-spacecraft RPO pair, each attitude loop through its own cFS container, ground segment and a telecommand to the chaser (native-ct-1)"
sos_configuration_id: two_spacecraft_sos
scenario:
  start_tai_ns: 1767225637000000000
  end_tai_ns: 1767225667000000000
  frames:
    - id: ground_chaser_enu
      platform_id: ground_chaser
      axes: AXES_KIND_ENU
      origin_geodetic:
        body: Earth
        latitude_rad: 0.49741883681838395
        longitude_rad: -1.4067353771074296
        height_m: 0.0
      description: "Cape-Canaveral-like ground station site, topocentric ENU: the chaser's tracking channel (question 10)"
    - id: ground_target_enu
      platform_id: ground_target
      axes: AXES_KIND_ENU
      origin_geodetic:
        body: Earth
        latitude_rad: 0.49741883681838395
        longitude_rad: -1.4067353771074296
        height_m: 0.0
      description: "The same site: the target's tracking channel (question 10)"
    - id: earth_fixed_demo_frame
      body: Earth
      axes: AXES_KIND_BODY_FIXED
      description: "Earth body-fixed Cartesian position frame both flight computers' telemetry is encoded in (drms/demo_ground_segment_flight.system.yaml parameters: frame_id)"
  events:
    - id: cmd1
      tai_ns: 1767225652000000000
      kind: command
      instance: chaser_thruster
      values:
        value: 4.0
      attributes:
        field: accel_scale
        from: ground_cmd
        command_class: throttle
  # ADR-004: seeds are logged inputs. One per container-bound controller; the container test
  # separates the two instances' `container.seed_key` (a native run reads none of them).
  seeds:
    chaser_controller: 42
    target_controller: 43
options:
  covariance: false
  default_step_rate_hz: 10.0
  sample_interval_s: 1.0
  real_time: false
  nearest_spd_projection: false
  accept_missing_stm_terms: false
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (native-ct-1)"
