# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- R3.4
# (docs/open-questions.md question 206: "the GMAT-bound target of ExternalCommandSource gets its
# test"). **Deliberately zero `scenario.events`** -- every command this run's own trajectory sees
# comes from a `crate::drm::command_source::ExternalCommandSource` the test wires through
# `RunConfig.command_source`, never from a DRM-declared `command` `ScenarioEvent` -- mirrors
# `drms/demo_external_command.drm.yaml`'s own identical convention (A3.1), generalized to a
# GMAT-bound target instead of a native `ConstantAccelModel` one.
#
# Reuses `drms/demo_ground_command.sos.yaml` (and, through it, `demo_ground_command_flight.
# system.yaml`/`demo_ground_command_ground.system.yaml`) completely unchanged, not modified at
# all: `demo_flt` already declares a real GMAT-propagated spacecraft
# (`dynamics_model: gmat.earth.jgm2_8x8.sun_moon`) with `port.consume_framed=cd_cmd_in` targeting
# `Cd` (`GMAT_WRITABLE_PARAMETERS`), and `demo_ground` already declares `port.cmd_out` -- so this
# fixture needs no new system or SOS definitions at all, only a DRM with an empty command
# scenario naming that same topology (the identical `classify_binding`/`resolve_gmat_command_port`
# resolution `crates/av-kernel/tests/demo_ground_command.rs`'s own DRM-declared-command test
# already exercises against this exact same topology -- see that file's own module doc, M25.2b).
#
# Same scenario window as `drms/demo_ground_command.drm.yaml`, but no fault and no declared
# events -- just the window -- so `demo_flt`'s propagation here is directly comparable to that
# fixture's own. `sample_interval_s` is coarser (60 s, not that fixture's 0.2 s) because
# `DrmError::CommandEpochNotOnSampleGrid` only ever checks a DRM-declared `command`
# `Scenario.event` (`crate::drm::executor::run_shared_group`'s own event-parsing loop) --
# an `ExternalCommandSource`-sourced command is never a `Scenario.event` at all, so it is never
# subject to that grid check, and this fixture needs no fine grid to prove it.
#
# crates/av-kernel/tests/external_command_source.rs drives this fixture (R3.4, `docs/
# open-questions.md` question 206).
