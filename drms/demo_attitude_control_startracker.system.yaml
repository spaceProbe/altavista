# SystemDefinition (proto/altavista/v1/system.proto), YAML transcoding -- M22.4. The star
# tracker instance for drms/demo_attitude_control.sos.yaml: seven `PORT_KIND_SIGNAL` IN ports
# consuming `attitude_control_truth_sys`'s own truth broadcast, and one `PORT_KIND_FRAMED` OUT
# port (schema "ccsds.spp") carrying the noisy attitude measurement to the native controller
# (crate::drm::controller::AttitudeControllerModel) over `demo_attitude_control.sos.yaml`'s own
# Connection to that instance's declared `startracker_in` port -- field-for-field the same
# `crate::drm::sensors::StarTrackerModel` shape as
# drms/demo_attitude_sensors_startracker.system.yaml, a new `id`/APID/port name only so this
# fixture bundle is self-contained.
id: attitude_control_startracker_sys
version: "1"
name: Star tracker measuring the M22.4 closed-loop demo's truth attitude
dynamics_model: startracker.control_demo
state_space_id: startracker.control_demo.space
state_space:
  id: startracker.control_demo.space
  components: []
ports:
  - name: truth_qx
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qy
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qz
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_qw
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wx
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wy
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: truth_wz
    kind: PORT_KIND_SIGNAL
    direction: PORT_DIRECTION_IN
  - name: st_meas
    kind: PORT_KIND_FRAMED
    direction: PORT_DIRECTION_OUT
    schema: ccsds.spp
packet_codecs:
  - id: st_meas_codec
    apid: 200
    is_command: false
    secondary_header_bytes: 0
    user_data_bytes: 32
    description: "star tracker attitude measurement (M22.4)"
    fields:
      - name: qx
        bit_offset: 0
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qy
        bit_offset: 64
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qz
        bit_offset: 128
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
      - name: qw
        bit_offset: 192
        bit_width: 64
        type: PACKET_FIELD_TYPE_FLOAT64
        unit: UNIT_DIMENSIONLESS
        scale: 1.0
        offset: 0.0
parameters:
  - name: startracker.update_rate_hz
    value: 20.0
    unit: UNIT_HERTZ
  - name: startracker.seed
    value: 1.0
  - name: startracker.noise_sigma_rad
    value: 0.00001
    unit: UNIT_RADIAN
  - name: output.seq
    unit: UNIT_DIMENSIONLESS
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (M22.4)"
