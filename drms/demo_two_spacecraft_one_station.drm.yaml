# DesignReferenceMission (proto/altavista/v1/system.proto), YAML transcoding -- native open items,
# task 6 (docs/open-questions.md question 254): drms/demo_two_spacecraft.drm.yaml (read its header for
# the attitude, telemetry and telecommand expectations, which are unchanged except that this window is
# 31 s, not 30 s, see below; the same `cmd1` to the chaser's thruster) over drms/demo_two_spacecraft_one_station.sos.yaml, in which
# BOTH spacecraft send their telemetry to ONE ground station, `ground`.
#
# ---------------------------------------------------------------------------------------------
# Expected behaviour, stated BEFORE running (crates/av-kernel/tests/drm_two_spacecraft_cfs.rs
# measures against exactly these numbers)
# ---------------------------------------------------------------------------------------------
#
# Two senders, one port. The window is 31 s so that every frame each spacecraft sends in its first 30 s
# is handled. Each flight computer sends one position packet per 1 Hz step (31 packets each, at
# 1 s .. 31 s) over its own latency link; both links declare the same latency (100 ms: the flight's
# `tm_out` 50 ms plus the station's `tm_in` 50 ms), so a frame sent at s is available at s + 0.1 s and
# handled by the station step ending at s + 1 s. From t = 2 s on, every station step receives TWO
# frames on `ground.tm_in` (one from `chaser_flight`, one from `target_flight`), in the router's
# deterministic order (receiving instance, port, emission epoch, sender instance id: question 108).
# The station handles both, every step: `output.ground.frames_handled@end` (the measure
# `ground_frames_handled`) is the number of telemetry frames the station decoded and used. The frames
# sent at 1 s .. 30 s are handled (30 from each spacecraft, 60 in all); the frame each flight sends at
# 31 s is available at 31.1 s, after the station's last step, and is still in flight when the window
# closes (it is among `dropped_in_flight_messages`). Before the station handled every frame on its port
# (`Inbox::last_on_port`), only the last frame of each step was handled: 30 of the 60, all from the
# target (the chaser sorts first in the router's order and was never seen).
# Contact state is kept per sender: the target rises through the 10 degree mask at t = 5.19 s and the
# chaser (3 km behind it along-track) at t = 5.59 s, so the station reports exactly one CONTACT_START
# for each sender (the events carry the sender: Event.provenance.attributes["sender"]) and no
# CONTACT_END (the pass sets after the window). Both are reported at t = 7 s: the first frame above
# the mask is the one sent at 6 s, available at 6.1 s, handled by the station step ending at 7 s.
id: two_spacecraft_one_station_drm
version: "1"
name: "Two-spacecraft RPO pair on ONE ground station, a telecommand to the chaser (native open items, task 6)"
sos_configuration_id: two_spacecraft_one_station_sos
scenario:
  start_tai_ns: 1767225637000000000
  end_tai_ns: 1767225668000000000
  frames:
    - id: ground_enu
      platform_id: ground
      axes: AXES_KIND_ENU
      origin_geodetic:
        body: Earth
        latitude_rad: 0.49741883681838395
        longitude_rad: -1.4067353771074296
        height_m: 0.0
      description: "Cape-Canaveral-like ground station site, topocentric ENU: the one station both spacecraft report to (question 10)"
    - id: earth_fixed_demo_frame
      body: Earth
      axes: AXES_KIND_BODY_FIXED
      description: "Earth body-fixed Cartesian position frame both flight computers' telemetry is encoded in (drms/demo_ground_segment_flight.system.yaml parameters: frame_id)"
  events:
    - id: cmd1
      tai_ns: 1767225652000000000
      kind: command
      instance: chaser_thruster
      values:
        value: 4.0
      attributes:
        field: accel_scale
        from: ground_cmd
        command_class: throttle
  # ADR-004: seeds are logged inputs. One per container-bound controller; the container test
  # separates the two instances' `container.seed_key` (a native run reads none of them).
  seeds:
    chaser_controller: 42
    target_controller: 43
measures:
  - name: ground_frames_handled
    expression: "output.ground.frames_handled@end"
    unit: UNIT_DIMENSIONLESS
options:
  covariance: false
  default_step_rate_hz: 10.0
  sample_interval_s: 1.0
  real_time: false
  nearest_spd_projection: false
  accept_missing_stm_terms: false
provenance:
  author_kind: AUTHOR_KIND_AGENT
  tool: "av-kernel drm executor authoring (native-open t6, question 254)"
