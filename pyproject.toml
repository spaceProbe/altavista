[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altavista"
version = "0.1.0"
description = "Build GMAT scenarios in Python and view them in a shared Three.js browser viewer"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "numpy>=1.24",
    # The frame registry and the CDM adapter import the committed protobuf bindings at
    # import time, so protobuf is a runtime dependency, not a dev extra.
    "protobuf>=5",
]

[project.optional-dependencies]
# The design-time gRPC service and the *_pb2_grpc stubs (question 85: Python is design-time
# only; grpcio bundles its own TLS stack, so it is never a runtime dependency of the package).
# `grpcio-tools` is pinned to exactly the version `altavista/pb/generate.py` records in its
# `GRPC_TOOLS_VERSION` constant (that script warns on drift), because regenerating the
# committed `*_pb2_grpc.py` stubs needs it. It was previously declared by neither extra and
# present only by accident in one long-lived venv, so a freshly created venv could not
# regenerate stubs at all -- found in the edge track's first round (2026-09-12) when a new
# venv's `generate.py` run crashed on `PackageNotFoundError`.
grpc = ["grpcio>=1.60", "grpcio-tools==1.83.1"]
# The test suite covers the gRPC services, so a dev install carries the grpc extra too.
dev = ["pytest>=8", "httpx>=0.27", "grpcio>=1.60", "grpcio-tools==1.83.1"]

[project.scripts]
altavista = "altavista.__main__:main"

[tool.setuptools.packages.find]
include = ["altavista*"]

[tool.pytest.ini_options]
# M23.2 added services/cfs/tests/ (the cFS lockstep clock, CCSDS golden and image-digest
# tests). They were invisible to the default gate until M23 review noticed the total stayed
# at 338 while 17 new tests existed: a test outside `testpaths` protects nothing, because
# nobody runs it. Both roots are listed so a plain `pytest -q` covers everything.
testpaths = ["tests", "services/cfs/tests"]
# -rs: print each skipped test's own reason in the terminal summary, even under a plain
# `pytest -q`. Added for M15.3 (docs/open-questions.md question 118): "tests run only when
# docker info succeeds, and otherwise skip with a recorded reason ... never silently, never
# buried" -- verified directly that a bare `pytest.skip(reason)` is otherwise invisible under
# `pytest -q` (only a "1 skipped" count and a bare "s" per test; the reason itself needs `-r`
# with an "s"/"a" flag). This is additive only: it does not change which tests pass, fail, or
# skip, only what a skip's own summary line prints.
addopts = "-rs"
